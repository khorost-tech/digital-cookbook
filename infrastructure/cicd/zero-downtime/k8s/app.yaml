# Приложение: Deployment на 3 реплики. Образ подставляется из ${IMAGE_V1}
# (envsubst в demo-скриптах). readiness /healthz завязан на схему: несовместимая
# миграция уводит старые поды в NotReady.
#
# RollingUpdate с maxUnavailable=0, maxSurge=1: новые реплики поднимаются до
# удаления старых — так наивный выкат честно показывает окно, где старые v1-поды
# ещё живы и уже видят несовместимую схему.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zdt-app
  namespace: cicd-zdt
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zdt-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: zdt-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ${IMAGE_V1}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DSN
              value: postgres://zdt:zdt@postgres:5432/zdt
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: zdt-app
  namespace: cicd-zdt
spec:
  selector:
    app: zdt-app
  ports:
    - port: 8080
      targetPort: 8080
