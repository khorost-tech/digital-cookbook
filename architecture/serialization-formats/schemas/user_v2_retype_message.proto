syntax = "proto3";
package tech.khorost.serialization;

// Поле email сменило тип со строки на вложенное сообщение — номер 3
// сохранён. В отличие от retype (int64 -> string), здесь wire-тип НЕ
// меняется: и string, и embedded message кодируются одним и тем же
// LEN-типом провода (длина + байты). Объяснение "несовпадение типа
// провода уводит поле в неизвестные без ошибки" (spec.md, §7.4, §14)
// здесь неприменимо — разбор реально ПЫТАЕТСЯ прочитать байты писателя
// как вложенное сообщение Contact. Строка почти никогда не оказывается
// валидной последовательностью тегов Protobuf, поэтому чаще всего это
// отказ (ошибка разбора вложенного сообщения) — но не всегда: короткая
// строка может случайно совпасть с валидным (пусть и бессмысленным)
// проводным представлением Contact, и тогда чтение молча вернёт мусор
// вместо ошибки.
message Contact {
  string value = 1;
}

message User {
  int64 id = 1;
  string name = 2;
  Contact email = 3;
}
