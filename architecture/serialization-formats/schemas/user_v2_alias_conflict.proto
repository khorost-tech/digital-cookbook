syntax = "proto3";
package tech.khorost.serialization;

// Псевдонимов у Protobuf нет вовсе: тождество поля определяется НОМЕРОМ,
// а не именем (spec.md, §6.2), поэтому "поле переименовали, но старое
// имя ещё занято другим полем" здесь невыразимо в принципе — как бы мы
// ни назвали поля в этом файле, для чтения байтов это не будет иметь
// значения. Схема ниже структурно ПОВТОРЯЕТ user_v1.proto (те же три
// поля, те же номера, те же типы) нарочно: это делает пару
// писатель/читатель вырожденной (schemas/spec.md, §6.4), и клетка
// получает n/a — тем же способом, каким reuse_tag вырожден для Avro и
// JSON Schema (у них нет понятия "переиспользование номера поля").
// alias_conflict — зеркальный случай: это Avro-специфичная находка, и
// для неё Protobuf оказывается тем плечом, где механизма нет вовсе.
message User {
  int64 id = 1;
  string name = 2;
  string email = 3;
}
