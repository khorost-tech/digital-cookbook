syntax = "proto3";
package tech.khorost.serialization;

// Номер 3 переиспользован после удаления email. Так делать нельзя, и
// стенд показывает почему: старая запись прочитается новой схемой без
// единой ошибки, но значение окажется не тем.
message User {
  int64 id = 1;
  string name = 2;
  int32 login_count = 3;
}
