# Ось 2: вариант конфига Angie. Монтируется вместо /etc/angie/http.d/default.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream backend {
    server rt-px-srv:8080;
}

# short-idle — proxy_read_timeout укорочен до 3 с (по умолчанию 60 с), чтобы
# простой дольше таймаута уложился в прогон; буферизация выключена.
server {
    listen 80;
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3s;
    }
}
