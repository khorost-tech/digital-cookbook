# Ось 2: вариант конфига Angie. Монтируется вместо /etc/angie/http.d/default.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream backend {
    server rt-px-srv:8080;
}

# no-upgrade — HTTP/1.1 к серверу, но заголовки Upgrade и Connection не проксируются:
# это hop-by-hop заголовки, и прокси их не передаёт, пока не сказано явно.
server {
    listen 80;
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
    }
}
