# Ось 3: два инстанса за Angie, по кругу (round-robin), без буферизации.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream backend {
    server rt-sc-a:8080;
    server rt-sc-b:8080;
}

server {
    listen 80;
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
