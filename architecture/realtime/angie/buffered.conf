# Ось 2: вариант конфига Angie. Монтируется вместо /etc/angie/http.d/default.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream backend {
    server rt-px-srv:8080;
}

# buffered — как в большинстве конфигов: буферизация ответа по умолчанию (proxy_buffering on).
server {
    listen 80;
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
