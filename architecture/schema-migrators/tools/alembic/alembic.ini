[alembic]
script_location = .
# models.py лежит рядом с env.py — каталог в sys.path.
prepend_sys_path = .
# URL берётся из переменной SMIG_URL в env.py — один конфиг на все СУБД.
# Контрольная проба монтирует invalid/ поверх versions/.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
