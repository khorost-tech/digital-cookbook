# Picodata одним инстансом: PG-протокол поверх собственного ядра. Для
# миграторов важны DDL и каталоги, а не шардирование, поэтому кластер не нужен.
# Тома нет намеренно: run.sh пересоздаёт контейнер перед каждым инструментом,
# чтобы следы одного мигратора не влияли на другой.
name: smig-pico
services:
  pico:
    image: docker.binary.picodata.io/picodata:26.1.3
    container_name: smig-pico
    hostname: pico
    command: >
      run --instance-dir /var/lib/picodata
      --iproto-listen 0.0.0.0:3301 --iproto-advertise pico:3301 --peer pico:3301
      --pg-listen 0.0.0.0:5432 --pg-advertise pico:5432
      --init-replication-factor 1
networks:
  default:
    name: smig
    external: true
