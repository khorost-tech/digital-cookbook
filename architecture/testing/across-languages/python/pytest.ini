[pytest]
testpaths = tests
# Интеграционные требуют Docker и стоят секунды, демо-свойства падают намеренно:
# по умолчанию не гоняем. Запуск: pytest -m integration / pytest -m property_demo
addopts = -m "not integration and not property_demo"
markers =
    integration: требует Docker (Testcontainers)
    property_demo: намеренная демонстрация, падает
