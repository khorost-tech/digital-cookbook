# Ось 7: Angie как L7 — grpc_pass разбирает HTTP/2 и выбирает бэкенд на каждый
# вызов. keepalive_timeout 15s — простой соединения клиента (ось 6), по умолчанию 75 с.
worker_processes 1;
events { worker_connections 1024; }
http {
    keepalive_timeout 15s;
    upstream grpc_l7 {
        server grpc-bl-1:9090;
        server grpc-bl-2:9090;
        server grpc-bl-3:9090;
    }
    server {
        listen 9000;
        http2 on;
        location / {
            grpc_pass grpc://grpc_l7;
        }
    }
}
