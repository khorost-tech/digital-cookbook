# Ось 7: Angie как L4 — stream-модуль пересылает TCP-соединения как есть.
# Монтируется вместо /etc/angie/angie.conf: блок stream живёт вне http.
# proxy_timeout 15s — простой соединения (ось 6), по умолчанию 10 минут.
worker_processes 1;
events { worker_connections 1024; }
stream {
    upstream grpc_l4 {
        server grpc-bl-1:9090;
        server grpc-bl-2:9090;
        server grpc-bl-3:9090;
    }
    server {
        listen 9000;
        proxy_pass grpc_l4;
        proxy_timeout 15s;
    }
}
