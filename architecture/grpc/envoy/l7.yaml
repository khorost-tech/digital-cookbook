# Ось 7: Envoy как L7 — http_connection_manager разбирает HTTP/2 и выбирает бэкенд
# на каждый вызов. idle_timeout 15s у соединения клиента — простой (ось 6):
# соединение без активных вызовов закрывается по истечении срока.
static_resources:
  listeners:
    - name: grpc_l7
      address: {socket_address: {address: 0.0.0.0, port_value: 9000}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_l7
                codec_type: HTTP2
                common_http_protocol_options: {idle_timeout: 15s}
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route: {cluster: backends, timeout: 0s}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backends
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: {http2_protocol_options: {}}
      load_assignment:
        cluster_name: backends
        endpoints:
          - lb_endpoints:
              - endpoint: {address: {socket_address: {address: grpc-bl-1, port_value: 9090}}}
              - endpoint: {address: {socket_address: {address: grpc-bl-2, port_value: 9090}}}
              - endpoint: {address: {socket_address: {address: grpc-bl-3, port_value: 9090}}}
