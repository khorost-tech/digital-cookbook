# Ось 7: Envoy как L4 — tcp_proxy пересылает соединение целиком.
# idle_timeout 15s — простой (ось 6), по умолчанию 1 час.
static_resources:
  listeners:
    - name: grpc_l4
      address: {socket_address: {address: 0.0.0.0, port_value: 9000}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: grpc_l4
                cluster: backends
                idle_timeout: 15s
  clusters:
    - name: backends
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backends
        endpoints:
          - lb_endpoints:
              - endpoint: {address: {socket_address: {address: grpc-bl-1, port_value: 9090}}}
              - endpoint: {address: {socket_address: {address: grpc-bl-2, port_value: 9090}}}
              - endpoint: {address: {socket_address: {address: grpc-bl-3, port_value: 9090}}}
