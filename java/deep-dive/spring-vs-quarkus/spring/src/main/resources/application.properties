server.port=8080

# Выносим actuator health на /health (вместо дефолтного /actuator/health) --
# единый путь опроса для bench-inside.sh у обоих фреймворков (Quarkus сторона
# ремаппит /q/health -> /health тем же приёмом, см. quarkus/application.properties).
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.enabled=true

# Меньше шума в логе при замере startup из bench-inside.sh.
logging.level.root=WARN
