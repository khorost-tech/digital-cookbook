# slf4j-simple: показывает сгенерированный SQL через логгер org.hibernate.SQL
# (независимо от legacy hibernate.show_sql, который печатает в System.out).
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.org.hibernate.SQL=debug
org.slf4j.simpleLogger.log.tech.khorost.dataaccess=info
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
