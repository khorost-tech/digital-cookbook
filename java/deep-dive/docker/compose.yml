# Общий стенд для java-deep-dive: Postgres + Kafka (KRaft, single-node).
# Переиспользуется под-модулями (data-access/messaging/resilience/...), которые
# добавляются отдельными задачами. Порты подобраны так, чтобы не конфликтовать
# с другими cookbook-стендами в этом репо (postgres: 5432/5433/5440/5441/5442
# уже заняты; kafka: 9092/9095 уже заняты) — см. wal/*, db-indexes/*, transactions/*.
services:
  postgres:
    image: postgres:18.4
    container_name: jdd-postgres
    environment:
      POSTGRES_USER: jdd
      POSTGRES_PASSWORD: jdd
      POSTGRES_DB: jdd
    ports:
      - "5455:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdd -d jdd"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.0
    container_name: jdd-kafka
    ports:
      - "9096:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # single-node: репликация=1, иначе offsets/transaction-топики не поднимутся
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
