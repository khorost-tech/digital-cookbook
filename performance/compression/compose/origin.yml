services:
  origin:
    image: postgres:18.4
    container_name: compression-origin
    environment:
      POSTGRES_PASSWORD: compression
      POSTGRES_DB: shop
    ports:
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20
