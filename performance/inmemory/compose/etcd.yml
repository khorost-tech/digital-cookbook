name: inmemory-cookbook
networks:
  inmemory-net:
    name: inmemory-net
    external: true
services:
  inmemory-etcd:
    image: quay.io/coreos/etcd:v3.7.0
    container_name: inmemory-etcd
    command: >
      etcd --name node1
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://inmemory-etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://inmemory-etcd:2380
      --initial-cluster node1=http://inmemory-etcd:2380
      --initial-cluster-state new
    ports: ["2379:2379"]
    networks: [inmemory-net]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
