# Aerospike 8.1.2.3 — конфиг ТОЛЬКО для Task 8 (сценарий working-set,
# performance/inmemory/benchmark, -scenario working-set).
#
# ОТДЕЛЬНЫЙ файл от aerospike/aerospike.conf (Task 5) намеренно: Task 5
# держит ram/flash с большими лимитами (1G/4G — весь датасет должен влезать
# свободно, там сравнивается ЦЕНА индекса, а не отказ). Task 8, наоборот,
# должен ЗАВЕДОМО упереться в границу памяти — нужен маленький лимит.
# Дважды использовать один и тот же conf под разные цели значило бы либо
# ломать Task 5 (слишком маленький лимит для index-cost на 200k записей),
# либо не давать Task 8 реального отказа (1G/4G никогда не заполнятся 200k
# записей ~35 МБ суммарного датасета).
#
# Живой прогон (docker exec asinfo -v "get-config:context=namespace;id=ram")
# подтвердил: storage-engine.data-size НЕ настраивается динамически
# (set-config вернул "ERROR:4:invalid set-config parameter") — обязателен
# перезапуск с этим значением в конфиге при старте. indexes-memory-budget,
# наоборот, настраивается динамически (set-config сработал живьём), но
# зафиксирован здесь же для воспроизводимости фиксированных лимитов при
# каждом up (бриф Task 8: "поднимает нужные системы с фиксированными
# лимитами").
#
# Границы (ПОСЛЕ РЕВЬЮ, см. task-8-report.md, "Фиксы по ревью" — синтетический
# хвост датасета до 500 000 записей УБРАН, сценарий работает на реальных
# 200 000 products из PostgreSQL целиком; см. подробное обоснование там же):
#   ram.storage-engine.data-size = 536 870 912 байт (512 МиБ, ЖЁСТКИЙ
#     МИНИМУМ сервера — меньшее значение сервер отвергает при старте,
#     живой прогон: "data-size must be >= 536870912"). Чтобы отказ в
#     записи всё равно наступал в разумных границах демо-датасета,
#     stop-writes-used-pct опущен с дефолта 70% до 1% (см. комментарий
#     внутри namespace ram ниже) — фактическая (живая) точка отказа лежит
#     в диапазоне 50 000-170 000 записей по 6 живым прогонам (см. README,
#     "Стенд 8"), СТРОГО внутри реального датасета 200 000 записей — без
#     всякого раздувания набора.
#   flash.indexes-memory-budget = 14 400 000 байт (~14.4 МБ). Пересчитан
#     под реальные 200 000 записей (не 500 000, как в снятой ревью версии):
#     200 000 записей * 64.00 байт индекса/запись (задокументированный факт
#     Task 5) = 12 800 000 байт, взято 14 400 000 (запас ~12.5%, та же
#     пропорция, что и в снятой версии) — flash обязан вместить ВЕСЬ
#     реальный датасет (200 000 записей) без единого отказа.
#   flash.storage-engine.filesize — не трогаем (4G, как в Task 5): данные
#     ~29 МБ на 200k записей даже близко не подходят к этой границе.

service {
	cluster-name docker
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address local
		port 3001
	}
}

namespace ram {
	replication-factor 1
	# nsup-period — период работы namespace supervisor, который в т.ч.
	# пересчитывает stop_writes. Живой прогон (два прогона сценария подряд,
	# см. task-8-report.md) вскрыл: после truncate() objects доходит до 0
	# быстро (секунды), но stop_writes остаётся ЗАСТРЯВШИМ в true с
	# ПРЕДЫДУЩЕГО прогона до следующего тика nsup — при дефолте/120с это
	# означает, что второй прогон подряд (без паузы ~2 минуты) начинает
	# ПЕРВУЮ порцию с отказов записи, даже когда namespace физически пуст.
	# 5с вместо 120 — чтобы флаг успевал переоцениваться в пределах паузы
	# между прогонами оркестровки (ops/working-set-demo.sh), а не молча
	# портил повторный прогон. Сам сценарий (benchmark/main.go,
	# waitStopWritesClear) ДОПОЛНИТЕЛЬНО ждёт стоп_writes=false явно перед
	# стартом — это защита независимо от значения nsup-period.
	nsup-period 5

	storage-engine memory {
		# 536870912 (512 МиБ) — ЖЁСТКИЙ МИНИМУМ сервера для storage-engine
		# memory. Живой прогон подтвердил: data-size=8000000 отказывается
		# стартовать (CRITICAL cfg.c:1867 "data-size must be >= 536870912").
		# Опустить ЭТУ границу нельзя. stop-writes-used-pct ТОЖЕ НЕ
		# настраивается динамически (живой прогон: set-config вернул
		# "ERROR:4:invalid set-config parameter") — обязателен здесь, при
		# старте. Дефолт 70% от 512 МиБ = ~358 МБ данных — недостижимо на
		# 200k записях без раздувания датасета. Вместо этого порог опущен
		# до 1%. Наивный расчёт (1% * 512 МиБ / 144 байт-данных на запись)
		# дал бы ~36 400 записей, но это НЕ фактическая точка отказа:
		# stop_writes пересчитывается периодически (nsup-period), не на
		# каждой записи, поэтому живой отказ наступает позже и с разбросом —
		# 50 000–190 000 записей по 9 прогонам (см. README, раздел про
		# разброс ram). 200k реального датасета достаточно, чтобы отказ
		# наступил заведомо, без синтетического хвоста.
		data-size 536870912
		stop-writes-used-pct 1
	}
}

namespace flash {
	replication-factor 1
	# То же самое соображение, что и у ram выше (см. коммент там) —
	# nsup-period короткий, чтобы stop_writes/quota пересчитывались быстро
	# между повторными прогонами оркестровки, а не были эффектом задержки
	# на 2 минуты. flash в этом сценарии его в принципе не должен достигать
	# (бюджет indexes-memory-budget ниже с запасом), но короткий период не
	# вредит и оставлен для симметрии/на случай будущего увеличения набора.
	nsup-period 5
	indexes-memory-budget 14400000

	storage-engine device {
		file /opt/aerospike/data/flash.dat
		filesize 4G
		read-page-cache true
	}
}
