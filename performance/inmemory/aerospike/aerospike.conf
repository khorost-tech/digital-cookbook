# Aerospike 8.1.2.3 — стенд "RAM vs flash" (Task 5, performance/inmemory).
#
# Взято за основу из фактического дефолтного конфига образа
# (docker run --rm aerospike/aerospike-server:8.1.2.3 cat /etc/aerospike/aerospike.conf),
# см. task-5-report.md — правка конфига "с нуля по памяти" запрещена бри
# фом, синтаксис 8.x меняется между мажорами.
#
# Дефолтный единственный namespace "test" (storage-engine device, файл
# /opt/aerospike/data/test.dat) заменён на два namespace серии:
#   ram   — storage-engine memory: и индекс, и данные в оперативной памяти;
#   flash — storage-engine device: первичный индекс ВСЕГДА в RAM (это
#           архитектурное свойство Aerospike, не опция), данные — в
#           файле на устройстве. Это и есть "флеш" namespace — герой
#           Task 8 (сценарий "рабочий набор за границей RAM").

service {
	cluster-name docker
}

logging {
	# Send log messages to stdout
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		# mesh is used for environments that do not support multicast
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		# Intra-cluster communication port (migrates, replication, etc)
		address local
		port 3001
	}
}

namespace ram {
	replication-factor 1
	nsup-period 120

	storage-engine memory {
		data-size 1G
	}
}

namespace flash {
	replication-factor 1
	nsup-period 120

	storage-engine device {
		file /opt/aerospike/data/flash.dat
		filesize 4G
		read-page-cache true
	}
}
