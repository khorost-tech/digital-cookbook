# То же, но без повторов соединения (retries 0): вариант kill-replica-noretry.
# Две реплики svc; проверка живости раз в 500 мс, после двух неудач реплика выводится.
global
  maxconn 4096
  # журнал запросов — в stdout контейнера: повторы и redispatch по каждому запросу
  log stdout format raw local0
defaults
  log global
  option httplog
  retries 0
  mode http
  timeout connect 1s
  timeout client 30s
  timeout server 30s
frontend web
  bind :8080
  default_backend svc
backend svc
  balance roundrobin
  option httpchk GET /healthz
  default-server inter 500ms fall 2 rise 2
  server a svc-a:8080 check
  server b svc-b:8080 check
