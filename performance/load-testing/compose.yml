# Стенд performance/load-testing: целевой сервис svc — эталон; генераторы
# нагрузки запускаются по одному (docker compose run --rm) с одинаковым
# лимитом ЦП; ось хаоса — профиль compose «chaos» (две реплики за HAProxy,
# зависимость за Toxiproxy).
name: load-testing
x-gen: &gen
  cpus: 2
  mem_limit: 1g
  volumes:
    - ./scenarios:/opt/stand/scenarios:ro
    - ./out:/opt/stand/out
  working_dir: /opt/stand
  depends_on: {svc: {condition: service_healthy}}
  profiles: [gen]
services:
  svc:
    build: {context: ., dockerfile: tools/Dockerfile.svc}
    image: load-testing-svc
    cpus: 2
  gen:
    <<: *gen
    build: {context: ., dockerfile: tools/Dockerfile.gen}
    image: load-testing-gen
  k6:
    <<: *gen
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    user: "0"
  locust:
    <<: *gen
    image: locustio/locust:2.46.7@sha256:8492fcaa6a07314551590f579219204e459d9fdc9dde060843bd2896e7a7259f
    entrypoint: []
    user: "0"
  gatling:
    <<: *gen
    image: maven:3.9-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
    mem_limit: 2g
    working_dir: /opt/gatling
    volumes:
      - ./gatling:/opt/gatling
      - ./out:/opt/stand/out
      - m2:/root/.m2
  # Ось хаоса
  dep:
    image: load-testing-svc
    environment: {ROLE: dep, S: 5ms, C: "64"}
    profiles: [chaos]
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: [./config/toxiproxy.json:/config/toxiproxy.json:ro]
    depends_on: [dep]
    profiles: [chaos]
  svc-a: &replica
    image: load-testing-svc
    environment: {DEP_URL: "http://toxiproxy:8666", MODE: "${MODE:-naive}", C: "64", DEP_TIMEOUT: 100ms}
    depends_on: [toxiproxy]
    profiles: [chaos]
  svc-b: *replica
  lb:
    image: haproxy:3.2.25@sha256:89c31eabc1ce443a13a42725a04df034b992c9d60580f4e6ef8b7bf5b15deddf
    volumes: ["./config/${HAPROXY_CFG:-haproxy.cfg}:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on: [svc-a, svc-b]
    profiles: [chaos]
  # управление сбоями: API Toxiproxy (в его образе нет оболочки) и docker kill — из раннера
  ctl:
    image: load-testing-gen
    command: ["sleep", "infinity"]
    profiles: [chaos]
  # Ось types, soak: та же программа с лимитом памяти — утечка доводит до OOM
  svc-soak:
    image: load-testing-svc
    environment: {LEAK: "4096"}
    mem_limit: 96m
    memswap_limit: 96m
    profiles: [soak]
volumes:
  m2:
