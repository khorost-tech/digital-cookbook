# Демо 2а: node affinity — под притягивается к помеченному узлу.
#
# Метку cookbook.khorost.tech/scheduling=demo ставит manifests/00-node-label.sh set
# на ОДИН worker (имя не захардкожено, скрипт печатает выбранный узел). Своих тейнтов
# стенд не ставит, узлы не дренирует.
#
# Почему nodeAffinity, а не nodeSelector: nodeSelector умеет только точное равенство
# «ключ = значение». У nodeAffinity есть операторы In / NotIn / Exists / DoesNotExist /
# Gt / Lt, список значений в одном терме и несколько альтернативных термов (OR между
# nodeSelectorTerms, AND между matchExpressions внутри терма). Здесь взята жёсткая форма
# requiredDuringSchedulingIgnoredDuringExecution — без подходящего узла под остаётся Pending.
#
# Под крошечный (pause, 10m/16Mi) и удаляется сразу после снятия фикстуры: кластер боевой.
---
apiVersion: v1
kind: Pod
metadata:
  name: affinity-demo
  namespace: cookbook-k8s
  labels:
    stand: cookbook-scheduling
    demo: node-affinity
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cookbook.khorost.tech/scheduling
                operator: In
                values:
                  - demo
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
