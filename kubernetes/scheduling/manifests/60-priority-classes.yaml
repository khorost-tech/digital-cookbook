# Демо 4 (часть 1): два кластерных PriorityClass для демонстрации вытеснения.
#
# ⚠️ PriorityClass — объект КЛАСТЕРНЫЙ, он не лежит в namespace и виден всему кластеру.
# Поэтому оба класса здесь устроены так, чтобы не влиять ни на кого, кроме подов стенда:
#
#   1) globalDefault: false у ОБОИХ. globalDefault: true назначил бы класс всем подам,
#      которые не указали priorityClassName ЯВНО, — то есть поменял бы приоритет подов
#      всего кластера. На общем кластере это недопустимо. Ровно один PriorityClass во всём
#      кластере может иметь globalDefault: true; если такого нет (как здесь), поды без
#      класса получают приоритет 0.
#
#   2) Значение жертв ОТРИЦАТЕЛЬНОЕ: -10. Это и есть главная страховка демо. Планировщик
#      выбирает в жертвы поды с приоритетом СТРОГО НИЖЕ вытесняющего и предпочитает самые
#      низкие. Чужие поды на узле класса не указывают, значит их приоритет 0 — он выше -10.
#      Наши жертвы гарантированно оказываются в самом низу очереди на вытеснение.
#
#   3) Значение вытесняющего 1000 — заведомо ниже системных классов кластера
#      (system-cluster-critical = 2000000000, system-node-critical = 2000001000),
#      так что наш под ничего системного не потеснит и сам уступит системному.
#
# Оба класса удаляются в teardown.sh (шаг 3) — обычным `delete -n` их не убрать.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cookbook-low
value: -10
globalDefault: false
description: "Жертвы демонстрации вытеснения (стенд cookbook scheduling). Отрицательное значение ниже приоритета 0 у подов без класса."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cookbook-high
value: 1000
globalDefault: false
description: "Вытесняющий под демонстрации (стенд cookbook scheduling). Заведомо ниже системных классов."
