# SealedSecret — этот файл безопасно хранить в git: encryptedData зашифрован
# публичным сертификатом контроллера sealed-secrets (kube-system), расшифровать
# его может только приватный ключ контроллера, которого здесь нет и в репозиторий
# он не попадает. Значение demo-password — фиктивное, придумано для демо.
#
# Получено: kubeseal 0.37.0 (образ alpine/k8s:1.36.2), запущенный ОДНОРАЗОВЫМ
# подом внутри кластера (namespace cookbook-k8s), сертификат — публичный
# /v1/cert.pem сервиса sealed-secrets.kube-system.svc:8080. Подробности и
# копипаст команд — в README.md, раздел «Демо: Sealed Secrets».
#
# Область видимости — по умолчанию (strict): шифротекст привязан к паре
# namespace+name (cookbook-k8s/demo-sealed). Тот же blob в другом namespace
# не расшифровывается контроллером — см. fixtures/20-sealedsecret.txt.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: demo-sealed
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
spec:
  encryptedData:
    demo-password: 
  template:
    metadata:
      name: demo-sealed
      namespace: cookbook-k8s
      labels: { stand: cookbook-secrets }
    type: Opaque
