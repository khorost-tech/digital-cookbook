apiVersion: v1
kind: Secret
metadata:
  name: demo-plain
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
type: Opaque
stringData:
  demo-password: cookbook-not-a-real-secret
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["/bin/sh","-c","sleep infinity"]
      env:
        - name: DEMO_PASSWORD
          valueFrom: { secretKeyRef: { name: demo-plain, key: demo-password } }
      resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
