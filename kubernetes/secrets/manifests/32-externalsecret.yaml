# ExternalSecret demo-external — тянет ключ password из secret/demo своего Vault
# (через SecretStore vault-stand стенда, не общекластерный store) и материализует
# его в обычный Secret demo-external в этом namespace. refreshInterval: 15s задаёт
# периодичность, с которой ESO обращается к Vault за актуальным значением, — это
# не гарантия верхней границы задержки синхронизации (см. замер ротации в README
# и fixtures/30-externalsecret.txt).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-external
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-stand
    kind: SecretStore
  target:
    name: demo-external
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/demo
        property: password
---
# Под-потребитель: получает demo-password переменной окружения из Secret
# demo-external ПРИ СТАРТЕ. Нужен для демонстрации в шаге 7: переменные окружения
# контейнера задаются один раз при запуске процесса и не обновляются вместе с
# ротацией Secret — пока сам под не перезапущен, он продолжает видеть старое
# значение, даже когда ESO уже обновил Secret.
apiVersion: v1
kind: Pod
metadata:
  name: external-secret-reader
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["/bin/sh", "-c", "sleep infinity"]
      env:
        - name: DEMO_PASSWORD
          valueFrom: { secretKeyRef: { name: demo-external, key: password } }
      resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
