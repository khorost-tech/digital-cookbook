# Собственный Vault стенда — dev-режим, ТОЛЬКО для этого стенда.
#
# Отдельный, изолированный Vault внутри cookbook-k8s, не общекластерный источник
# секретов: не используется ничей чужой Vault и ничья чужая конфигурация — ни как
# источник значений, ни как образец. Поднят специально для демонстрации механизма
# ExternalSecret на заведомо фиктивных данных, воспроизводим читателем без доступа
# к чужой инфраструктуре. Сравнение с общекластерным store — см. README, раздел
# «Демо: ExternalSecret».
#
# Хранилище — В ПАМЯТИ (dev-режим Vault, backend "inmem" внутри процесса): при
# рестарте пода все данные теряются, это ожидаемо и не проблема для демо-стенда —
# персистентность здесь не нужна.
#
# PodSecurity namespace — baseline (см. README серии). Обычно dev-режим Vault
# запускают с capability IPC_LOCK (чтобы mlock() не пускал секреты в swap), но
# добавление капабилити контейнеру запрещено политикой baseline (capabilities.add
# вне разрешённого baseline-набора отклоняется admission-контроллером) — и мы не
# повышаем привилегии namespace ради стенда. Легальный путь: dev-режим Vault сам
# отключает enforcement mlock, а SKIP_SETCAP=true и VAULT_DISABLE_MLOCK=true в
# окружении контейнера явно просят entrypoint-скрипт образа не пытаться выставить
# cap_ipc_lock на бинарник (это всё равно упало бы без CAP_SETFCAP) и не требовать
# mlock — под стартует без единой добавленной капабилити.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vault, stand: cookbook-secrets }
  template:
    metadata:
      labels: { app: vault, stand: cookbook-secrets }
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.21.4
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: cookbook-root-token # фиктивный root-токен, только для этого стенда
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: 0.0.0.0:8200
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
            - name: SKIP_SETCAP
              value: "true"
            - name: VAULT_DISABLE_MLOCK
              value: "true"
          ports:
            - containerPort: 8200
              name: http
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            # capabilities не трогаем: образ стартует под root и сам понижает
            # привилегии до пользователя vault через su-exec (entrypoint), для
            # чего ему нужны штатные setuid/setgid из дефолтного набора baseline —
            # drop:["ALL"] ломает этот su-exec (setgroups: Operation not permitted).
            # Капабилити сверх дефолтного baseline-набора (в частности IPC_LOCK) не
            # добавляем — см. комментарий в шапке файла.
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
spec:
  selector: { app: vault, stand: cookbook-secrets }
  ports:
    - name: http
      port: 8200
      targetPort: 8200
