# RBAC — кто может прочитать Secret, а не как он доставлен и зашифрован.
# Два SA для контраста:
#
# limited: намеренно узкая роль (pods-reader) — get/list/watch на pods и
#   НИКАКИХ прав на secrets. Показывает, что доступ к поду не даёт доступа
#   к секретам сам по себе — RBAC разделяет ресурсы по типу, а не «всё, что
#   относится к нагрузке».
#
# broad: обратная сторона — роль (secrets-reader) с get/list на secrets.
#   Демонстрирует ключевой урок задачи: такая роль открывает ВСЕ Secret
#   namespace, включая те, что доставлены через SealedSecret (demo-sealed)
#   и ExternalSecret (demo-external) — способ доставки и хранения в git не
#   влияет на то, кто может прочитать итоговый объект Secret в кластере.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: limited
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pods-reader
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: limited-pods-reader
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pods-reader
subjects:
  - kind: ServiceAccount
    name: limited
    namespace: cookbook-k8s
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: broad
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-reader
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: broad-secrets-reader
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secrets-reader
subjects:
  - kind: ServiceAccount
    name: broad
    namespace: cookbook-k8s
