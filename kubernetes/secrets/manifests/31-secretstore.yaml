# SecretStore vault-stand — отдельный store стенда, namespaced (не Cluster!), не
# общекластерный. Указывает на собственный Vault стенда (manifests/30-vault.yaml,
# Service vault.cookbook-k8s.svc:8200), поднятый специально для этой демонстрации.
# Токен ниже — фиктивный dev-root-токен cookbook-root-token, которым засеян
# demo-секрет в шаге 2 README; действует только внутри этого одноразового
# dev-инстанса. Сравнение с общекластерным store — см. README, раздел «Демо:
# ExternalSecret».
apiVersion: v1
kind: Secret
metadata:
  name: vault-stand-token
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
type: Opaque
stringData:
  token: cookbook-root-token
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-stand
  namespace: cookbook-k8s
  labels: { stand: cookbook-secrets }
spec:
  provider:
    vault:
      server: http://vault.cookbook-k8s.svc:8200
      path: secret
      version: v2 # свой Vault дев-режима смонтировал secret/ как KV v2 — см. шаг 2 README
      auth:
        tokenSecretRef:
          name: vault-stand-token
          key: token
