# Собственный Prometheus стенда — задача B2, "autoscaling".
#
# В кластере k8s-volga НЕТ Prometheus Operator (см. README задачи B0/B1),
# метрики собирает VictoriaMetrics vmagent с remote-write на ВНЕШНИЙ хост
# 192.168.71.83:8428. Опираться на него для Prometheus Adapter/KEDA нельзя —
# это неуправляемая инфраструктура вне стенда, читатель её не имеет.
# Поэтому здесь разворачивается отдельный Prometheus внутри ns cookbook-k8s,
# который сам скрейпит поды этого namespace по конвенции prometheus.io/*
# (kubernetes_sd_configs role: pod, namespaces.names: [cookbook-k8s]).
#
# RBAC — минимальный, НЕ ClusterRole: Role/RoleBinding только в cookbook-k8s
# на get/list/watch pods. ns monitoring не трогается.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: cookbook-k8s
  labels:
    app: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-reader
  namespace: cookbook-k8s
  labels:
    app: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-reader
  namespace: cookbook-k8s
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: cookbook-k8s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cookbook-k8s
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: cookbook-k8s-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - cookbook-k8s
        relabel_configs:
          # Скрейпим только поды с prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Путь метрик из аннотации prometheus.io/path (по умолчанию /metrics
          # уже используется metricgen, но относимся к аннотации как к источнику истины)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Порт из аннотации prometheus.io/port подставляется в адрес скрейпа
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # namespace и pod — сохраняем как обычные лейблы результата
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          # КЛЮЧЕВОЙ relabel для Prometheus Adapter: Object-метрика описывает
          # k8s-ресурс Service, адаптер ассоциирует метрику по лейблу
          # "service" (см. rules.custom в prometheus-adapter-values.yaml).
          # У metricgen лейбл пода app=metricgen совпадает с именем Service
          # metricgen — переносим label app пода в label service метрики.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cookbook-k8s
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}   # стенд, не прод — без persistent storage
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cookbook-k8s
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
