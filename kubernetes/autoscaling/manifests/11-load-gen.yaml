apiVersion: v1
kind: Pod
metadata: { name: load-gen, namespace: cookbook-k8s }
spec:
  containers:
    - name: load
      image: busybox:1.37
      command: ["/bin/sh","-c","while true; do wget -q -O- http://php-apache; done"]
      resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 200m, memory: 64Mi } }
