apiVersion: v1
kind: Namespace
metadata:
  name: cookbook-net
  labels:
    purpose: digital-cookbook
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cookbook-net-quota
  namespace: cookbook-net
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "15"
