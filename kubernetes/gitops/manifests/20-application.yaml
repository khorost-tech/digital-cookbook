# Первый Application: «что в git — то и в кластере».
#
# Объект живёт в НАШЕМ namespace (cookbook-argocd) — это принципиально. Application —
# обычный namespaced-объект, и читает его тот контроллер, в чьём namespace он лежит.
# Боевой ArgoCD в ns argocd этот объект не увидит: в его argocd-cmd-params-cm ключ
# application.namespaces не задан вовсе (проверено в fixtures/10-argocd.txt, блок
# «предполётная проверка»), а без него контроллер работает строго по своему namespace.
#
# project: default — проект, который НАШ argocd-server создал сам при первом старте
# (cookbook-argocd/default, creationTimestamp 2026-07-24T16:00:46Z). Одноимённый проект
# боевого ArgoCD (argocd/default, 2026-07-19T09:08:29Z) — другой объект в другом
# namespace, мы его не трогаем.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: cookbook-argocd
  labels:
    stand: cookbook-gitops
spec:
  project: default
  source:
    # Схема git:// — голый git-протокол, без TLS и без аутентификации. ArgoCD её принимает:
    # repo-server шеллит настоящий git, а git:// у него встроенный транспорт (в образе
    # v3.4.1 git 2.51.0, среди git-remote-* помощников git-remote-git нет именно потому,
    # что этот транспорт вкомпилирован). Проверка до создания Application — в фикстуре,
    # блок «умеет ли ArgoCD в git://».
    repoURL: git://git-server.cookbook-argocd.svc.cluster.local/demo.git
    path: apps/demo
    # HEAD, а не хеш: смысл стенда — показать, что ArgoCD сам догоняет ветку. Фактический
    # хеш, на который синхронизировались, обязан совпасть с seed-коммитом
    # d049270d788de26273d85992c271c5994a6d7ca8 — это и есть доказательство, что источник
    # именно наш внутрикластерный git-сервер, а не что-то ещё.
    targetRevision: HEAD
  destination:
    # Тот же кластер, в котором работает контроллер. Внутренний адрес — чтобы не зависеть
    # от того, как кластер зарегистрирован снаружи; свой кластер ArgoCD знает как in-cluster.
    server: https://kubernetes.default.svc
    # В манифестах в git namespace не указан намеренно (см. 05-git-server.yaml) — его
    # подставляет destination. Тот же namespace, что и у ArgoCD: RBAC у нас namespace-scoped,
    # в чужой namespace этот контроллер писать и не смог бы.
    namespace: cookbook-argocd
  # ДЕМО 2. Ручной режим (syncPolicy отсутствовал вовсе) прожил ровно до M1: ArgoCD видел
  # расхождение, показывал OutOfSync и пальцем не шевелил, пока не попросят. Здесь режим
  # переключается на автоматический — и это делается ПРАВКОЙ МАНИФЕСТА, а не кнопкой в UI:
  # сам способ включения автоматики тоже декларативный и лежит в git.
  #
  # Три флага — три разных механизма, и путать их не стоит:
  #   * automated — вообще разрешает контроллеру синхронизировать без запроса. Реагирует на
  #     НОВУЮ РЕВИЗИЮ в репозитории, и реагирует по ОПРОСУ, а не по событию: фактические
  #     значения нашего экземпляра — appResyncPeriod=2m0s, appResyncJitter=1m0s (контроллер
  #     печатает их в лог при старте, см. фикстуру 30-selfheal.txt). Замеренная задержка
  #     prune — ~120.6 s по логу (наблюдение циклом дало 121.8 s, но это верхняя граница),
  #     при этом фактические длины циклов опроса в том же логе гуляют
  #     от 125 до 403 s: «задержка равна timeout.reconciliation» — не константа, а жребий.
  #   * selfHeal — разрешает синхронизировать в ответ на РАСХОЖДЕНИЕ КЛАСТЕРА с той же самой
  #     ревизией, то есть откатывать ручные правки. Работает не по опросу, а по watch-событию
  #     плюс задержка self-heal (у нас --self-heal-timeout-seconds не задан, работает
  #     экспоненциальный backoff). ПРАВИЛО, которое контроллер печатает сам строками
  #     «retrying in ...»: ПОСЛЕ попытки self-heal номер N он ждёт 2 s × 3^(N-1), но не
  #     больше cap 300 s, и только потом разрешает попытку N+1; перед ПЕРВОЙ попыткой паузы
  #     нет — отсчитывать не от чего. Замеренный откат `scale --replicas=3` — 1.6 s; но
  #     дрейф, сделанный сразу следом, ждал 54.4 s (пауза после четвёртой попытки), а
  #     следующий уткнулся в 162 s. Потолок 300 s тоже виден в логе: после шестой попытки
  #     формула требовала 486 s, а напечатано «retrying in 4m59.4s». Без selfHeal автоматика
  #     догоняла бы git, но ручной scale жил бы до следующего коммита.
  #   * prune — разрешает УДАЛЯТЬ из кластера объекты, исчезнувшие из git. Без него удаление
  #     манифеста оставляет объект в кластере, а Application — в OutOfSync.
  #
  # ГРАНИЦА МЕХАНИЗМА (замерено, фикстура, блок 3): self-heal возвращает то, что ОБЪЯВЛЕНО
  # в git, у объектов, которыми владеет ЭТОТ Application. Чужой ConfigMap в том же namespace
  # он не тронул даже при prune: true, а метка, дописанная руками к его собственному
  # Deployment, выжила откат replicas в том же цикле.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
