apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo
  namespace: cookbook-k8s
spec:
  serviceName: demo
  replicas: 3
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command:
            - "/bin/sh"
            - "-c"
            - 'echo "$(hostname) первая запись $(date -u +%FT%TZ)" >> /data/journal.txt; sleep infinity'
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs-csi
        resources:
          requests:
            storage: 1Gi
