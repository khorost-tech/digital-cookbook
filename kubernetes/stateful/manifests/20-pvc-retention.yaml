apiVersion: v1
kind: Service
metadata:
  name: demo-rp
  namespace: cookbook-k8s
spec:
  clusterIP: None
  selector:
    app: demo-rp
  ports:
    - port: 80
      name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-rp
  namespace: cookbook-k8s
spec:
  serviceName: demo-rp
  replicas: 2
  selector:
    matchLabels:
      app: demo-rp
  template:
    metadata:
      labels:
        app: demo-rp
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command:
            - "/bin/sh"
            - "-c"
            - 'echo "$(hostname) первая запись $(date -u +%FT%TZ)" >> /data/journal.txt; sleep infinity'
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs-csi
        resources:
          requests:
            storage: 1Gi
