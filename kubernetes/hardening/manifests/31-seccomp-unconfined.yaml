# Демо 3, шаг 1в-2: снятие seccomp-фильтра (Unconfined) и изоляция seccomp-блокировки —
# во ВРЕМЕННОМ namespace, ЯВНО помеченном enforce=privileged.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ NAMESPACE С enforce=privileged. Проверено на кластере (см. фикстуру): на
# k8s-volga включён cluster-wide PodSecurity default = baseline, и baseline НЕ допускает
# seccompProfile: Unconfined — admission отклоняет под с текстом
#   pods "…" is forbidden: violates PodSecurity "baseline:latest": seccompProfile (pod must not
#   set securityContext.seccompProfile.type to "Unconfined")
# Дефолт baseline закрывает Unconfined в непомеченных, baseline- и restricted-namespace. Но PSA
# штатно позволяет namespace ЯВНО объявить уровень СЛАБЕЕ дефолта: namespace с меткой
# pod-security.kubernetes.io/enforce=privileged admission не ограничивает, и Unconfined-под в нём
# проходит. Именно так снимается seccomp-фильтр и получается Seccomp: 0 живьём (фикстура, шаг 1в).
#
# ЭТОТ NAMESPACE ВРЕМЕННЫЙ И НАМЕРЕННО enforce=privileged. Он НЕ входит в manifests/
# 00-namespaces.yaml. Демо создаёт его (этим файлом), снимает замер и сносит целиком
# (kubectl delete -f этого файла), как временный warn-namespace в Демо 2. teardown.sh тоже
# удаляет его с --ignore-not-found — стенд не должен оставлять privileged-namespace с
# работающими подами. Поды безопасны: drop ALL caps, allowPrivilegeEscalation: false,
# runAsNonRoot, без host-namespaces, без hostPath. Unconfined снимает ТОЛЬКО seccomp-фильтр,
# доступа к узлу не даёт.
apiVersion: v1
kind: Namespace
metadata:
  name: cookbook-hardening-privileged
  labels:
    stand: cookbook-hardening
    purpose: digital-cookbook
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
---
# Скромный потолок временного namespace: демо крутит три крошечных пода.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cookbook-hardening-privileged-quota
  namespace: cookbook-hardening-privileged
  labels:
    stand: cookbook-hardening
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cookbook-hardening-privileged-limits
  namespace: cookbook-hardening-privileged
  labels:
    stand: cookbook-hardening
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 16Mi
      default:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "500m"
        memory: 512Mi
---
# Шаг 1в: тот же безопасный под, что и в 30-seccomp-pods.yaml, но с seccompProfile: Unconfined.
# Здесь (enforce=privileged) admission его пропускает → Seccomp: 0, Seccomp_filters: 0 живьём.
apiVersion: v1
kind: Pod
metadata:
  name: seccomp-unconfined
  namespace: cookbook-hardening-privileged
  labels:
    stand: cookbook-hardening
    demo: seccomp
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: Unconfined
  containers:
    - name: box
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
---
# Шаг 2, «строгая» половина пары: python:3.13-alpine под RuntimeDefault. Тот же образ, те же
# (пустые) caps, что у Unconfined-половины ниже — единственная переменная — профиль. Под
# RuntimeDefault get_mempolicy(239) блокируется seccomp-фильтром (EPERM).
apiVersion: v1
kind: Pod
metadata:
  name: syscall-runtimedefault
  namespace: cookbook-hardening-privileged
  labels:
    stand: cookbook-hardening
    demo: seccomp
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: box
      image: python:3.13-alpine
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
---
# Шаг 2, «свободная» половина пары: тот же python-образ, те же пустые caps, но Unconfined.
# get_mempolicy(239) здесь проходит (ret=0) — значит capability для него не нужна, а EPERM у
# RuntimeDefault-половины даёт именно seccomp. Это изолирует seccomp-блокировку от caps.
apiVersion: v1
kind: Pod
metadata:
  name: syscall-unconfined
  namespace: cookbook-hardening-privileged
  labels:
    stand: cookbook-hardening
    demo: seccomp
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: Unconfined
  containers:
    - name: box
      image: python:3.13-alpine
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
