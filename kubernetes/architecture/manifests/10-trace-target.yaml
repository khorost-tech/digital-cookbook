# Демо пути применения: один kubectl apply рождает цепочку объектов
# Deployment -> ReplicaSet -> Pod, каждый следующий создаётся своим контроллером.
# Образ pause не делает ничего полезного — важен только сам путь создания.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-demo
  namespace: cookbook-k8s
  labels:
    app: trace-demo
    stand: cookbook-architecture
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trace-demo
  template:
    metadata:
      labels:
        app: trace-demo
        stand: cookbook-architecture
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
