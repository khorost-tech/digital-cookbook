apiVersion: v1
kind: Pod
metadata: { name: oomkill, namespace: cookbook-k8s }
spec:
  restartPolicy: Always
  containers:
    - name: stress
      image: polinux/stress:1.0.4
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "0"]
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits:   { cpu: 100m, memory: 128Mi }
