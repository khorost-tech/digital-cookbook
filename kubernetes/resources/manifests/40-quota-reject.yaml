apiVersion: apps/v1
kind: Deployment
metadata: { name: quota-buster, namespace: cookbook-k8s }
spec:
  replicas: 6
  selector: { matchLabels: { app: quota-buster } }
  template:
    metadata: { labels: { app: quota-buster } }
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: 100m, memory: 1Gi }
            limits:   { cpu: 200m, memory: 1Gi }
