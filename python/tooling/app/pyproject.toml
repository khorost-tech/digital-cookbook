# Проект-подопытный. Набор намеренно реалистичный: девятнадцать прямых
# зависимостей и 51 пакет со всеми транзитивными. На игрушечном наборе из
# двух пакетов разница между инструментами утонула бы в постоянных
# издержках запуска, и замер показал бы, кто быстрее стартует, а не кто
# быстрее ставит.
#
# Dev-зависимости включены в тот же набор намеренно: в реальном проекте
# ставят и их, а pytest с testcontainers понадобятся стенду для главы о
# тестировании.
#
# ВЕРСИИ ПИНУЮТСЯ ЖЁСТКО, ДО ПАТЧА, И ВЗЯТЫ У РЕЗОЛВЕРА, А НЕ ИЗ ГОЛОВЫ.
# Первая версия этого файла содержала httpx==0.29.0, orjson==3.11.5,
# structlog==25.5.0 и tenacity==9.1.2 — четыре несуществующие версии из
# десяти. Поймал их резолвер отказом, но поймал бы не всегда: попади в пин
# существующая, но другая версия, набор молча разъехался бы с ожидаемым.
#
# Диапазоны здесь недопустимы по той же причине: инструменты вправе
# разрешить их по-разному, и тогда они установят РАЗНЫЕ наборы, а
# сравнение потеряет смысл ещё до первого замера. Проверка одинаковости
# установленного всё равно стоит блокирующей, но начинать надо отсюда.

[project]
name = "tooling-subject"
version = "0.1.0"
description = "Подопытный проект стенда python/tooling"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "httpx==0.28.1",
    "uvicorn==0.52.4",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "orjson==3.12.0",
    "python-dateutil==2.9.0.post0",
    "psycopg[binary]==3.3.4",
    "redis==8.1.0",
    "jinja2==3.1.6",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mypy==2.3.1",
    "ruff==0.16.4",
    "testcontainers==4.15.0",
    "hypothesis==6.165.10",
]

[tool.poetry]
package-mode = false

# Poetry берёт источник отсюда, а не из переменных окружения: у него свой
# способ, и выравнивать условия приходится в его терминах.
[[tool.poetry.source]]
name = "local"
url = "http://index:8080/simple"
priority = "primary"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
