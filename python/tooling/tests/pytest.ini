[pytest]
# Предупреждения об устаревании — ошибки.
#
# Ревью нашло в стенде живой DeprecationWarning: testcontainers.postgres
# в 4.15.0 оставлен ради совместимости и просит перейти на
# testcontainers.community.postgres. Прогон при этом был зелёным, и
# заметить это можно было только вчитавшись в вывод.
#
# Фильтр возводит такие предупреждения в ошибки, и не только у
# testcontainers: любой устаревший вызов в стенде теперь роняет прогон.
# Исключения перечисляются здесь же и поимённо — молчаливых нет.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
