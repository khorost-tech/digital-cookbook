name: python-typing-and-data

services:
  # Один контейнер на оба сценария: ни типы, ни чтение Parquet не требуют
  # соседей. Времени этот стенд не меряет, поэтому и изоляция от шума
  # машины ему не нужна — все его величины счётные.
  bench:
    build: .
    init: true
    volumes:
      # Исходники подопытного проекта монтируются только на чтение:
      # дефект применяется к КОПИИ внутри контейнера, оригинал остаётся
      # чистым. Иначе прерванный прогон оставил бы в репозитории
      # испорченный файл, и следующий замер пошёл бы от него.
      - ./app:/src:ro
      - ./bench:/bench:ro
      - ./fixtures:/fixtures
    working_dir: /bench
    command: ["sleep", "infinity"]
