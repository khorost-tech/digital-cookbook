name: python-data-access

services:
  db:
    image: postgres:18
    init: true
    environment:
      POSTGRES_USER: stand
      POSTGRES_PASSWORD: stand
      POSTGRES_DB: stand
      # Замер должен видеть работу запросов, а не борьбу за журнал. Значения
      # заданы явно, чтобы фикстуры не зависели от умолчаний образа.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # PostgreSQL 18 монтирует данные в /var/lib/postgresql, а не в
    # /var/lib/postgresql/data: старый путь версия отвергает при старте.
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/db
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=200
      # Счёт запросов — первичная метрика этой волны, и считать его надо на
      # стороне базы: счётчик в клиенте не увидит того, чего клиент не знает.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stand -d stand"]
      interval: 2s
      timeout: 3s
      retries: 30

  bench:
    build: .
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: stand
      PGPASSWORD: stand
      PGDATABASE: stand
      DSN: "postgresql://stand:stand@db:5432/stand"
    volumes:
      - ./app:/app
      - ./bench:/bench
      - ./db:/db
      - ./fixtures:/fixtures
      - ./migrations:/migrations
    # Плечи запускаются сценариями, а не тут: у каждого свой способ
    # соединения, и работать они должны по одному.
    command: ["sleep", "infinity"]

volumes:
  pgdata:
