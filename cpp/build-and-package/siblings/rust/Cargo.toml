# Пакет без единой внешней зависимости. Пустой [dependencies] — это
# ОБЪЯВЛЕНИЕ, которое написал автор стенда, а не измерение. Уликой служит
# то, что сборка проходит с --offline при CARGO_NET_OFFLINE=true: любой
# внешний крейт в таких условиях уронил бы её.
[package]
name = "stand_service"
version = "0.1.0"
edition = "2021"

[dependencies]

# Release без отладочной информации — как и у плеча C++ (Release + strip).
# Сам strip выполняется отдельным шагом в Dockerfile тем же инструментом
# binutils, что и у C++: сравнивать размеры имеет смысл, только когда
# отладочная информация убрана у обоих одинаковым способом.
[profile.release]
debug = false
