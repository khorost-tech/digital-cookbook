# Локальный Postgres для demo-сервиса. demo-креды — только для локального стенда.
# Порт 5433 наружу (чтобы не конфликтовать со стандартным 5432).
services:
  db:
    image: postgres:17
    container_name: rust-prod-db
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "5433:5432"
