[package]
name = "axum-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }   # ServiceExt::oneshot для тестов handler'а
