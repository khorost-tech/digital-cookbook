# Многорегиональная топология: 9 узлов, три «региона» по три зоны.
#
# Девять, а не три, потому что SURVIVE REGION FAILURE поднимает число
# ГОЛОСУЮЩИХ реплик до пяти при ограничении «не больше двух в одном
# регионе» — на трёх узлах такую раскладку не построить.
#
# «Регион» здесь — это метка --locality. Межрегиональных задержек в
# стенде НЕТ и эмулировать их нечем: ядро WSL2 собрано без планировщиков
# трафика (ни netem, ни prio). scripts/05-geo.sh измеряет фактический RTT
# и печатает его до всех замеров, чтобы результат не приняли за
# измерение географии.
#
# Проект называется crdbgeo, чтобы не пересекаться с базовым кластером
# (проект crdb): это отдельный кластер со своими томами.
name: crdbgeo

x-geo: &geo
  image: cockroachdb/cockroach:v26.2.5
  healthcheck:
    test: ["CMD", "cockroach", "node", "status", "--insecure", "--host=localhost:26257"]
    interval: 5s
    timeout: 5s
    retries: 40
    start_period: 20s
  stop_grace_period: 60s

services:
  geo1:
    <<: *geo
    container_name: geo1
    hostname: geo1
    command: >
      start --insecure
      --join=geo1:26257,geo2:26257,geo3:26257,geo4:26257,geo5:26257,geo6:26257,geo7:26257,geo8:26257,geo9:26257
      --advertise-addr=geo1:26257 --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
      --locality=region=ru-central,zone=a --cache=256MiB --max-sql-memory=256MiB
    ports: ["15440:26257", "18090:8080"]
    volumes: ["geo1-data:/cockroach/cockroach-data"]

  geo2:
    <<: *geo
    container_name: geo2
