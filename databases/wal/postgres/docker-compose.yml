services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_PASSWORD: waldemo
      POSTGRES_DB: waldemo
    ports: ["5433:5432"]
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - checkpoint_timeout=30min
    volumes:
      - ./archive:/var/lib/postgresql/archive
