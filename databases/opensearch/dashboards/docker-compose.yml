# Стенд для статьи «OpenSearch Dashboards: Discover, визуализации и дашборды»
# https://khorost.tech/observability/opensearch-dashboards/
#
# OpenSearch 3.5.0 (demo security) + OpenSearch Dashboards 3.5.0.
# Security ВКЛючён — нужен для логина в Dashboards и живого RBAC (reader-роль, tenants).
#
# DEMO-ONLY: пароли ниже — только для локального стенда.
services:
  opensearch:
    image: opensearchproject/opensearch:3.5.0
    container_name: dash-os
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=DashDemo#2026"   # DEMO-ONLY
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9221:9200"

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    container_name: dash-osd
    environment:
      - 'OPENSEARCH_HOSTS=["https://dash-os:9200"]'
      - "OPENSEARCH_SSL_VERIFICATIONMODE=none"              # demo self-signed TLS
      - "OPENSEARCH_USERNAME=kibanaserver"                  # сервисный пользователь demo security
      - "OPENSEARCH_PASSWORD=kibanaserver"                  # DEMO-ONLY (дефолт demo security)
    ports:
      - "5602:5601"
    depends_on:
      - opensearch
