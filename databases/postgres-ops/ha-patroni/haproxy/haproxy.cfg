global
    maxconn 200

defaults
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

# Статистика HAProxy — http://localhost:7000/
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# Порт 5000 → ТЕКУЩИЙ лидер. Patroni REST отвечает 200 на GET /leader только на лидере,
# поэтому HAProxy автоматически переключит трафик после failover.
listen primary
    bind *:5000
    option httpchk GET /leader
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# Порт 5001 → реплики (чтение). GET /replica отвечает 200 только на живых репликах.
listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008
