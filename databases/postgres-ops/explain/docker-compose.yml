services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_PASSWORD: shopdemo
      POSTGRES_DB: shopdemo
    ports: ["5434:5432"]
    # random_page_cost=1.1 — SSD/NVMe-реалистичное (default 4.0 предполагает HDD).
    # max_parallel_workers_per_gather=0 — детерминированные однопоточные планы для чтения EXPLAIN.
    # work_mem высок — чтобы sort/hash не уходили на диск и планы были чистыми.
    # pg_stat_statements — для сценария 09 (поиск тяжёлых запросов).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=64MB
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - random_page_cost=1.1
