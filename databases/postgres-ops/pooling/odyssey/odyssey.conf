# Odyssey 1.5.1 — многопоточный пулер от Yandex. Актуален для РФ-инфраструктуры.
# Минимальная конфигурация: transaction pooling к одному postgres.

daemonize no
log_to_stdout yes
log_format "%p %t %l [%i %s] (%c) %m\n"
workers 2
resolvers 1

listen {
    host "0.0.0.0"
    port 6434
}

storage "postgres_server" {
    type "remote"
    host "postgres"
    port 5432
}

database "opsdemo" {
    user "postgres" {
        authentication "none"       # клиент не проверяется (стенд в изолированной сети)
        storage "postgres_server"
        storage_db "opsdemo"
        storage_user "postgres"
        pool "transaction"          # боевой режим
        pool_size 5                 # намеренно мало — показать мультиплексирование
    }
}
