[databases]
; одна и та же БД под тремя режимами пулинга — для сравнения семантики (сц.02).
opsdemo           = host=postgres port=5432 dbname=opsdemo
opsdemo_session   = host=postgres port=5432 dbname=opsdemo pool_mode=session
opsdemo_statement = host=postgres port=5432 dbname=opsdemo pool_mode=statement

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; auth_type=trust — клиента не проверяем (стенд в изолированной docker-сети);
; postgres тоже с trust (POSTGRES_HOST_AUTH_METHOD), поэтому server-соединения без пароля.
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

; pool_mode=transaction — боевой режим: server-соединение занимается на транзакцию, а не
; на сессию. Именно он мультиплексирует клиентов и ломает prepared/SET/LISTEN (см. сц.03).
pool_mode = transaction

max_client_conn = 1000

; default_pool_size намеренно мал — показать мультиплексирование многих клиентов
default_pool_size = 5

; extra_float_digits шлёт libpq/pgx при старте — в transaction pooling его надо игнорировать
ignore_startup_parameters = extra_float_digits,options
