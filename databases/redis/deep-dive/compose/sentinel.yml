name: redis-sentinel-cookbook
networks:
  redis-sentinel-net:
    name: redis-sentinel-net
    # Явная подсеть — чтобы у redis-master был СТАТИЧЕСКИЙ адрес, и Sentinel
    # мог мониторить его по IP, а не по имени. Это не косметика, см. большой
    # комментарий у sentinel-1 ниже: мониторинг по hostname в этой среде
    # ломает failover полностью.
    ipam:
      config:
        - subnet: 172.28.0.0/16
services:
  redis-master:
    image: ${REDIS_IMAGE:-redis:8.8}
    container_name: redis-master
    # Персистентность не в фокусе этого стенда (см. Стенд #3) — appendonly
    # включён просто чтобы рестарт/ресинк вели себя предсказуемо, без
    # тонкой настройки fsync.
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    networks:
      redis-sentinel-net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  # Реплики тоже реплицируются с IP, а не с имени: когда мастер убивают,
  # его имя перестаёт резолвиться, и `replicaof redis-master 6379` заставил
  # бы реплику долбиться в DNS вместо того, чтобы честно зафиксировать
  # master_link_status:down.
  redis-replica-1:
    image: ${REDIS_IMAGE:-redis:8.8}
    container_name: redis-replica-1
    command: redis-server --replicaof 172.28.0.10 6379 --appendonly yes
    ports: ["6380:6379"]
    networks:
      redis-sentinel-net:
        ipv4_address: 172.28.0.11
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  redis-replica-2:
    image: ${REDIS_IMAGE:-redis:8.8}
    container_name: redis-replica-2
    command: redis-server --replicaof 172.28.0.10 6379 --appendonly yes
    ports: ["6381:6379"]
    networks:
      redis-sentinel-net:
        ipv4_address: 172.28.0.12
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  # Каждый sentinel-N пишет свой sentinel.conf на старте (redis-sentinel
  # переписывает конфиг-файл в рантайме — дописывает known-sentinels/
  # known-replicas по мере обнаружения — поэтому нужен реальный файл, а не
  # только аргументы командной строки).
  #
  # `sentinel monitor mymaster 172.28.0.10 6379 2` — мониторинг по IP, и это
  # ПРИНЦИПИАЛЬНО, а не стилистика. Первая версия этого стенда мониторила по
  # имени (`redis-master`) с `resolve-hostnames yes`, и failover не случался
  # ВООБЩЕ: после `docker kill redis-master` встроенный DNS Docker
  # (127.0.0.11) перестаёт резолвить имя мёртвого контейнера и начинает
  # отдавать таймауты (живьём видели и `no such host`, и `lookup
  # redis-master: i/o timeout` — последнее и есть проблема). Sentinel
  # резолвит hostname синхронно в своём event loop; каждый DNS-таймаут
  # задерживает итерацию цикла на секунды, а задержка >2с — ровно то
  # условие, по которому Sentinel включает защитный режим TILT (`INFO
  # sentinel` -> `sentinel_tilt:1`). В TILT Sentinel сознательно НЕ
  # выполняет failover (он не доверяет своим же измерениям времени) и
  # перезаходит в него снова и снова, пока имя не резолвится. Наблюдалось
  # живьём: 0 промоушенов из 2 попыток, `sentinel_tilt:1` на момент
  # 80-секундного дедлайна. С мониторингом по IP DNS из этого пути исчезает
  # целиком, и failover отрабатывает за ~7с.
  #
  # down-after-milliseconds=5000 и failover-timeout=10000 — сознательно ниже
  # дефолтов Sentinel (30000/180000): дефолты сделали бы live-прогон стенда
  # неоправданно долгим для теста, не меняя механику failover как таковую.
  # Именно эти два числа и определяют наблюдаемое время failover — цифры в
  # FIXTURES надо читать как следствие ЭТОЙ конфигурации, а не как «скорость
  # Sentinel вообще».
  sentinel-1:
    image: ${REDIS_IMAGE:-redis:8.8}
    container_name: sentinel-1
    command: >-
      sh -c "printf 'port 26379\nsentinel monitor mymaster 172.28.0.10 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n' > /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"
    ports: ["26379:26379"]
    networks: [redis-sentinel-net]
    depends_on:
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
  sentinel-2:
    image: ${REDIS_IMAGE:-redis:8.8}
    container_name: sentinel-2
    command: >-
      sh -c "printf 'port 26379\nsentinel monitor mymaster 172.28.0.10 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n' > /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"
    ports: ["26380:26379"]
    networks: [redis-sentinel-net]
    depends_on:
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
  sentinel-3:
    image: ${REDIS_IMAGE:-redis:8.8}
    container_name: sentinel-3
    command: >-
      sh -c "printf 'port 26379\nsentinel monitor mymaster 172.28.0.10 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n' > /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"
    ports: ["26381:26379"]
    networks: [redis-sentinel-net]
    depends_on:
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
