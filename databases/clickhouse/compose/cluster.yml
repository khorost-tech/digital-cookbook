# cluster.yml — стенд #5 серии "ClickHouse: глубокое погружение": 2 шарда x
# 2 реплики (4 CH-ноды) + 1 узел ClickHouse Keeper. ОТДЕЛЬНЫЙ, полностью
# самостоятельный compose (своя сеть clickhouse-cluster-net, своё имя
# проекта) — НЕ поднимается поверх compose/compose.yml (single-node CH+PG
# стенда #1/#2/#3/#4), в отличие от compose/kafka.yml (тот слоился на общую
# clickhouse-cookbook-net). Разные топологии/hostnames внутри одной сети
# создавали бы путаницу (single-node "clickhouse" vs 4 кластерных нод) без
# практической пользы — этот стенд самодостаточен и поднимается/сносится
# независимо.
#
# Версия образа CH — та же, что во всей серии: clickhouse/clickhouse-server:
# 26.6.1.1193 (сверено живьём в Task 1). Образ Keeper — тот же тег
# (clickhouse/clickhouse-keeper:26.6.1.1193), сверяется живьём при первом
# `docker pull` этого стенда (см. README, секция "Проверено живьём
# (distributed, ...)").
#
# Топология:
#   ch-s1-r1 (шард 1, реплика r1) — HTTP host 28123, native host 28001
#   ch-s1-r2 (шард 1, реплика r2) — HTTP host 28124, native host 28002
#   ch-s2-r1 (шард 2, реплика r1) — HTTP host 28125, native host 28003
#   ch-s2-r2 (шард 2, реплика r2) — HTTP host 28126, native host 28004
#   keeper1  (ClickHouse Keeper, 1 узел — прод = 3 для кворума)
#            — client host 28181 (native Keeper-протокол, ZK-совместимый)
#
# Внутри сети (клиенты-контейнеры на clickhouse-cluster-net):
#   ch-s1-r1:9000 / ch-s1-r2:9000 / ch-s2-r1:9000 / ch-s2-r2:9000 (native)
#   ch-s1-r1:8123 / ... :8123 (HTTP)
#   keeper1:9181 (Keeper client, ZK-совместимый протокол)
#
# С хоста: localhost:28123-28126 (HTTP), localhost:28001-28004 (native),
# localhost:28181 (Keeper client). Порты 28001-28004/28123-28126/28181
# свободны на момент создания стенда (2026-07-10) — см. полный список
# занятых портов репозитория в README (диапазоны postgres/kafka/CH
# single-node уже задокументированы там).
#
# remote_servers/macros/keeper — см. ../config/*.xml, общие для всех 4 нод
# (remote-servers.xml, use-keeper.xml) + per-нода macros (macros-s1-r1.xml и
# т.д., назначает {shard}/{replica} для ReplicatedMergeTree-пути).
#
# CLICKHOUSE_DB=demo — та же БД, что single-node стенд (Task 1), но
# ФИЗИЧЕСКИ независимая (свои тома данных на каждой из 4 нод) — совпадение
# имени БД не создаёт коллизий между стендами.

x-clickhouse-common: &clickhouse-common
  image: clickhouse/clickhouse-server:26.6.1.1193
  environment:
    CLICKHOUSE_DB: demo
    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  volumes:
    - ../config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
    - ../config/use-keeper.xml:/etc/clickhouse-server/config.d/use-keeper.xml:ro
  networks:
    - clickhouse-cluster-net
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O- http://localhost:8123/ping || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s
  depends_on:
    keeper1:
      condition: service_healthy

services:
  ch-s1-r1:
    <<: *clickhouse-common
    container_name: clickhouse-cluster-s1-r1
    hostname: ch-s1-r1
    volumes:
      - ../config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ../config/use-keeper.xml:/etc/clickhouse-server/config.d/use-keeper.xml:ro
      - ../config/macros-s1-r1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch-s1-r1-data:/var/lib/clickhouse
    ports:
      - "28123:8123"
      - "28001:9000"

  ch-s1-r2:
    <<: *clickhouse-common
    container_name: clickhouse-cluster-s1-r2
    hostname: ch-s1-r2
    volumes:
      - ../config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ../config/use-keeper.xml:/etc/clickhouse-server/config.d/use-keeper.xml:ro
      - ../config/macros-s1-r2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch-s1-r2-data:/var/lib/clickhouse
    ports:
      - "28124:8123"
      - "28002:9000"

  ch-s2-r1:
    <<: *clickhouse-common
    container_name: clickhouse-cluster-s2-r1
    hostname: ch-s2-r1
    volumes:
      - ../config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ../config/use-keeper.xml:/etc/clickhouse-server/config.d/use-keeper.xml:ro
      - ../config/macros-s2-r1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch-s2-r1-data:/var/lib/clickhouse
    ports:
      - "28125:8123"
      - "28003:9000"

  ch-s2-r2:
    <<: *clickhouse-common
    container_name: clickhouse-cluster-s2-r2
    hostname: ch-s2-r2
    volumes:
      - ../config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ../config/use-keeper.xml:/etc/clickhouse-server/config.d/use-keeper.xml:ro
      - ../config/macros-s2-r2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch-s2-r2-data:/var/lib/clickhouse
    ports:
      - "28126:8123"
      - "28004:9000"

  keeper1:
    image: clickhouse/clickhouse-keeper:26.6.1.1193
    container_name: clickhouse-cluster-keeper1
    hostname: keeper1
    volumes:
      - ../config/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper1-data:/var/lib/clickhouse-keeper
    ports:
      - "28181:9181"
    networks:
      - clickhouse-cluster-net
    healthcheck:
      # ClickHouse Keeper реализует ZK-совместимые "four-letter word"
      # команды (ruok/mntr/conf) поверх своего client-порта — 'ruok'
      # отвечает 'imok', когда узел готов принимать запросы. Через netcat
      # (образ содержит /usr/bin/nc) — bash-builtin /dev/tcp НЕ работает
      # здесь: CMD-SHELL исполняется через /bin/sh (не bash), проверено
      # живьём ("can't create /dev/tcp/... nonexistent directory").
      test: ["CMD-SHELL", "echo ruok | nc -w 2 127.0.0.1 9181 | grep -q imok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  clickhouse-cluster-net:
    name: clickhouse-cluster-net

volumes:
  ch-s1-r1-data:
  ch-s1-r2-data:
  ch-s2-r1-data:
  ch-s2-r2-data:
  keeper1-data:
