[databases]
app = host=pg-primary port=5432 dbname=app

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
; sqlx (Rust) шлёт extra_float_digits в startup-пакете, а pgbouncer в transaction pool mode
; по умолчанию отвергает незнакомые startup-параметры: клиент падает ещё до первого запроса
; с "unsupported startup parameter: extra_float_digits". pgx (Go) и pgjdbc (Java) этот
; параметр не шлют, поэтому упирается в него только Rust-клиент.
ignore_startup_parameters = extra_float_digits
