name: sqlite-embedded

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    volumes:
      # PostgreSQL 18: том именно на /var/lib/postgresql — образ отвергает старый
      # путь /var/lib/postgresql/data и падает на старте.
      - pgdata:/var/lib/postgresql
      # Общий том с unix-сокетом: через него плечо B ходит в тот же сервер,
      # но без сети. Это и есть способ отделить цену хопа от цены сервера.
      - pgsock:/var/run/postgresql
    command:
      - postgres
      - -c
      - listen_addresses=*

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes:
      - miniodata:/data

  bench:
    build: .
    depends_on:
      - postgres
      - minio
    volumes:
      - pgsock:/var/run/postgresql
      - benchdata:/data
      - ./fixtures:/fixtures
    environment:
      PG_TCP_DSN: postgres://bench:bench@postgres:5432/bench?sslmode=disable
      PG_UDS_DSN: postgres:///bench?host=/var/run/postgresql&user=bench&password=bench&sslmode=disable
      SQLITE_PATH: /data/bench.db
    # Держим контейнер живым: сценарии запускаются через docker compose exec.
    command: ["sleep", "infinity"]

  litestream:
    image: litestream/litestream:0.5.16
    depends_on:
      - minio
    volumes:
      - benchdata:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: ["replicate", "-config", "/etc/litestream.yml"]

volumes:
  pgdata:
  pgsock:
  miniodata:
  benchdata:
