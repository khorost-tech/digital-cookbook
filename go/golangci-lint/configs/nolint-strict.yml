# Ось 5: то же плюс nolintlint — директива обязана назвать линтер, объяснить
# причину и что-то подавлять.
version: "2"
run:
  relative-path-mode: gomod
linters:
  default: none
  enable: [errcheck, noctx, nolintlint]
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    presets: []
