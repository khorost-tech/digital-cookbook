# Ось 4: errcheck не проверяет тесты — правило по пути.
version: "2"
run:
  relative-path-mode: gomod
linters:
  default: standard
  enable: [bodyclose, errorlint, gocritic, gosec, noctx, perfsprint, prealloc, rowserrcheck, sqlclosecheck]
  settings:
    govet:
      enable: [nilness, shadow]
  exclusions:
    generated: disable
    presets: []
    rules:
      - path: _test\.go
        linters: [errcheck]
