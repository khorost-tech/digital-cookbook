# Ось 4, контроль: линтеры курируемого набора, никаких исключений, сгенерированный код линтуется.
version: "2"
run:
  relative-path-mode: gomod
linters:
  default: standard
  enable: [bodyclose, errorlint, gocritic, gosec, noctx, perfsprint, prealloc, rowserrcheck, sqlclosecheck]
  settings:
    govet:
      enable: [nilness, shadow]
  exclusions:
    generated: disable
    presets: []
