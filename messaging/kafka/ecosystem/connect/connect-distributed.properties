# connect-distributed.properties — worker для стенда #7 ("экосистема").
# Запускается как есть (connect-distributed.sh) внутри отдельного контейнера
# kafka-connect (см. ../../compose/ecosystem.yml), поверх УЖЕ поднятого
# 3-брокерного кластера ../../compose/compose.yml (bootstrap внутри сети —
# kafka1:9092,kafka2:9092,kafka3:9092).
#
# Converters — JsonConverter БЕЗ schemas.enable (schemaless JSON): для этого
# стенда FileStream-коннекторы гоняют простые строки/JSON-значения, Schema
# Registry демонстрируется ОТДЕЛЬНО через REST (см. ../schemas/ +
# ops/ecosystem-demo.sh) — в проде эти два компонента типично связывают через
# AvroConverter (Confluent-совместимый или Apicurio), но добавление
# Avro-конвертера в Connect plugin.path — отдельный кусок инфраструктуры
# (нужен ещё один jar/плагин), сознательно не усложняем демонстрацию: цель
# стенда — показать, что каждый из трёх компонентов (SR/Connect/сериализация)
# реально работает против apache/kafka 4.3.1, а не собрать production-топологию.
bootstrap.servers=kafka1:9092,kafka2:9092,kafka3:9092
group.id=ecosystem-connect-cluster

key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# Внутренние топики Connect — RF=3, совпадает с дефолтом кластера
# (KAFKA_DEFAULT_REPLICATION_FACTOR=3 в ../../compose/compose.yml).
offset.storage.topic=connect-offsets
offset.storage.replication.factor=3
config.storage.topic=connect-configs
config.storage.replication.factor=3
status.storage.topic=connect-status
status.storage.replication.factor=3

offset.flush.interval.ms=5000

listeners=HTTP://:8083
plugin.path=/opt/kafka/libs
