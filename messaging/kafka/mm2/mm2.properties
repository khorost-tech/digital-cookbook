# mm2.properties — MirrorMaker 2 (dedicated/standalone режим, connect-mirror-maker.sh),
# стенд #9 серии "Kafka: глубокое погружение". Реплицирует топик `orders`
# us-east -> us-west (active-passive по умолчанию — вторая половина matrix
# us-west->us-east ВЫКЛЮЧЕНА здесь; для active-active-фазы демо см.
# mm2-active-active.properties, где включена обратная сторона тоже, с
# намеренно узким topics-фильтром, чтобы не поймать цикл сразу же).
#
# Явно ОГРАНИЧЕН списком topics/groups (не ".*" по умолчанию) — на кластере
# us-east уже живут топики/группы предыдущих 8 стендов серии (demo-log,
# demo-groups, demo-repl-*, demo-storage-*, ecosystem-*, clients-*), их
# незачем тащить через MM2 в этот демо-полигон.

clusters = us-east, us-west

us-east.bootstrap.servers = kafka1:9092,kafka2:9092,kafka3:9092
us-west.bootstrap.servers = west1:9092

# --- Направление репликации ---
us-east->us-west.enabled = true
us-west->us-east.enabled = false

# --- Фильтр: только наш демо-топик и наша демо-группа ---
us-east->us-west.topics = orders
us-east->us-west.groups = orders-cg.*

# --- Внутренние топики MM2 (heartbeats/checkpoints/offset-syncs) и топики
#     Connect-воркера (config/offset/status storage) — RF=1 достаточно для
#     демо-полигона; us-west single-node физически не может дать больше 1. ---
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

tasks.max = 1

# --- Быстрые интервалы (дефолты MM2 — минуты, непригодно для живой демо-съёмки) ---
refresh.topics.interval.seconds = 5
refresh.groups.interval.seconds = 5
emit.heartbeats.interval.seconds = 5
emit.checkpoints.interval.seconds = 5
sync.topic.configs.interval.seconds = 5

# --- Трансляция consumer offset'ов ---
# emit.checkpoints — MirrorCheckpointConnector пишет Checkpoint-записи в
#   us-east.checkpoints.internal на us-west (это то, что читает
#   RemoteClusterUtils.translateOffsets/MirrorClient).
# sync.group.offsets — ДОПОЛНИТЕЛЬНО пишет транслированный offset ПРЯМО в
#   __consumer_offsets us-west для группы orders-cg.*, так что consumer с
#   тем же group.id, стартовавший на us-west "с нуля", подхватит позицию
#   автоматически, без явного вызова translateOffsets — это и есть механизм
#   failover, который демонстрирует стенд.
emit.checkpoints.enabled = true
sync.group.offsets.enabled = true
sync.group.offsets.interval.seconds = 5

# ACL-синхронизация выключена: PLAINTEXT-кластеры без авторизации
# (AclAuthorizer не сконфигурирован ни на одном из двух кластеров) — попытка
# синхронизировать ACL на кластере без Authorizer бессмысленна для этого демо.
sync.topic.acls.enabled = false

# --- Connect worker internal topics (обязательны для dedicated MM2 — тоже
#     Connect-кластер под капотом, со своими config/offset/status топиками
#     НА КАЖДОМ из clusters) ---
us-east.config.storage.replication.factor = 1
us-east.offset.storage.replication.factor = 1
us-east.status.storage.replication.factor = 1
us-west.config.storage.replication.factor = 1
us-west.offset.storage.replication.factor = 1
us-west.status.storage.replication.factor = 1
