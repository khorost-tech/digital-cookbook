# mm2-active-active.properties — фаза 2 стенда #9: та же пара кластеров, но
# ОБЕ стороны репликации включены (active-active). Отличие от mm2.properties
# (фаза 1, active-passive) — ровно две строки: us-west->us-east.enabled=true
# и добавлен topics-фильтр для этого направления.
#
# ⚠️ Живая находка: dedicated MM2 (connect-mirror-maker.sh) НЕ подхватывает
# новую пару кластеров "на лету" — какие SourceAndTarget-пары (herders)
# поднимать, решается ОДИН РАЗ при старте процесса по списку `enabled=true`
# в конфиге. Включить us-west->us-east потребовало ПЕРЕЗАПУСКА контейнера
# mm2 с этим файлом (не reload). Это не баг стенда — задокументированная
# особенность dedicated-режима; в Connect-режиме (MM2 как коннекторы поверх
# уже работающего Connect-кластера) можно было бы добавить/включить пару
# через REST POST /connectors без рестарта воркера — но это другой режим
# запуска MM2 (см. README про причины остаться на dedicated здесь).
#
# Защита от циклов в этом демо — ДВОЙНАЯ, и это честно задокументировано:
#   1) topics-фильтр каждого направления — ТОЧНОЕ имя "orders" (не regex
#      вида ".*"), а реплицированные топики уже НОСЯТ префикс
#      (us-east.orders / us-west.orders) — они физически не совпадают со
#      строкой "orders" и потому НЕ попадают под фильтр повторного
#      направления. Это единственный механизм, который реально
#      останавливает цикл В ЭТОМ стенде (фильтр — наш выбор конфигурации).
#   2) У самого MM2 есть встроенный loop-guard (эвристика по имени топика:
#      DefaultReplicationPolicy.topicSource() распознаёт префикс и
#      MirrorSourceConnector по умолчанию исключает топики, уже несущие имя
#      целевого кластера как префикс, из списка "topics" для обратного
#      направления) — то есть даже при ".*"-фильтре цикл не возник бы;
#      но полагаться ТОЛЬКО на встроенную эвристику мы не стали — здесь
#      узкий явный фильтр как основная, наблюдаемая защита.

clusters = us-east, us-west

us-east.bootstrap.servers = kafka1:9092,kafka2:9092,kafka3:9092
us-west.bootstrap.servers = west1:9092

us-east->us-west.enabled = true
us-west->us-east.enabled = true

us-east->us-west.topics = orders
us-east->us-west.groups = orders-cg.*

us-west->us-east.topics = orders
us-west->us-east.groups = .^

replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

tasks.max = 1

refresh.topics.interval.seconds = 5
refresh.groups.interval.seconds = 5
emit.heartbeats.interval.seconds = 5
emit.checkpoints.interval.seconds = 5
sync.topic.configs.interval.seconds = 5

emit.checkpoints.enabled = true
sync.group.offsets.enabled = true
sync.group.offsets.interval.seconds = 5

sync.topic.acls.enabled = false

us-east.config.storage.replication.factor = 1
us-east.offset.storage.replication.factor = 1
us-east.status.storage.replication.factor = 1
us-west.config.storage.replication.factor = 1
us-west.offset.storage.replication.factor = 1
us-west.status.storage.replication.factor = 1
