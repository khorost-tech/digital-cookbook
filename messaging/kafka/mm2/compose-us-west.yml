# compose-us-west.yml — второй, НЕЗАВИСИМЫЙ KRaft-кластер ("us-west", target
# для MirrorMaker 2) для стенда #9 ("гео-репликация"). Отдельная сеть,
# отдельный CLUSTER_ID, отдельные хостовые порты — от us-east (../compose/compose.yml,
# уже поднятый 3-брокерный кластер, здесь используется КАК ЕСТЬ, без изменений)
# этот файл НЕ зависит и не пересекается ни сетью, ни портами.
#
# Почему single-node (1 брокер, combined broker+controller), а не 3, как у
# us-east: цель стенда — показать МЕХАНИКУ MM2 (репликация топика, трансляция
# offset, failover, active-active), а не повторно демонстрировать ISR/кворумную
# отказоустойчивость самого кластера (это уже сделано в стенде #3 на
# us-east-топологии). Один брокер как MM2-target — штатная конфигурация для
# демо/DR-полигона; в проде target тоже обычно полноценный multi-broker
# кластер, но для целей ЭТОГО стенда лишние 2 ноды только грузят хост, не
# добавляя ничего к самой демонстрации (репликация/трансляция offset/failover
# одинаково работают что в single-node, что в multi-broker target).
#
# CLUSTER_ID сгенерирован живьём: docker exec kafka-cookbook-1
#   /opt/kafka/bin/kafka-storage.sh random-uuid  ->  dsCwIx_xSnypavvUKs6ogw
#
# Порты хоста: us-east занял 19092-19094 (брокеры), 18080 (schema registry),
# 18083 (kafka-connect) — см. ../README.md. Этот файл использует 29092
# (свободен на момент создания стенда, 2026-07-09).
#
# Внутри compose-сети kafka-cookbook-west-net: bootstrap.servers=west1:9092
# С хоста: bootstrap.servers=localhost:29092
# Из сети MM2 (контейнер mm2 подключён к ОБЕИМ сетям — см. compose-mm2.yml):
#   us-east: kafka1:9092,kafka2:9092,kafka3:9092 (kafka-cookbook-net)
#   us-west: west1:9092                          (kafka-cookbook-west-net)

services:
  west1:
    image: apache/kafka:4.3.1
    container_name: kafka-cookbook-west-1
    environment:
      CLUSTER_ID: "dsCwIx_xSnypavvUKs6ogw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@west1:9093"
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://west1:9092,HOST://localhost:29092
      # Single-node: RF=1 (реплицировать не на кого) — это ТОЛЬКО про
      # внутреннюю надёжность us-west-кластера, к MM2-репликации между
      # кластерами отношения не имеет (та работает поверх clients API,
      # не поверх ISR).
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - kafka-west-net
    ports:
      - "29092:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

networks:
  kafka-west-net:
    name: kafka-cookbook-west-net
