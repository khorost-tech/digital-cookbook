# slf4j-simple: приглушаем шумные логи kafka-clients (метаданные/heartbeat),
# оставляем warn+ от клиента и info от собственных классов стенда.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.tech.khorost.kafka.logbasics=info
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=true
