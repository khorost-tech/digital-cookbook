name: flink-01-state

x-flink-props: &flink-props |
  jobmanager.rpc.address: jobmanager
  state.backend.type: rocksdb
  execution.checkpointing.interval: 10s
  execution.checkpointing.incremental: true
  execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
  state.checkpoints.dir: file:///tmp/flink-checkpoints
  taskmanager.numberOfTaskSlots: 4

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Flink-сток в режиме exactly-once запрашивает таймаут транзакции в 1 час, а брокер
      # по умолчанию разрешает 15 минут -> InitProducerId падает и джоба уходит в бесконечный
      # RESTARTING. Поднимаем лимит брокера, а не занижаем таймаут стока: короткая транзакция,
      # протухшая раньше восстановления джобы, означает потерю данных.
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 3600000

  jobmanager:
    build: .
    ports:
      - "8081:8081"
    command: jobmanager
    depends_on:
      - kafka
    environment:
      FLINK_PROPERTIES: *flink-props
    volumes:
      - checkpoints:/tmp/flink-checkpoints

  taskmanager:
    build: .
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: *flink-props
    volumes:
      - checkpoints:/tmp/flink-checkpoints

volumes:
  checkpoints:
