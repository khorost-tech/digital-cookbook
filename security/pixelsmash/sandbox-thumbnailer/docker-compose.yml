# Пример hardened-контейнера для обработки недоверенного медиаконтента (thumbnailer/
# декодер на базе FFmpeg), актуально в контексте CVE-2026-8461 (PixelSmash,
# libavcodec/magicyuv.c) и аналогичных будущих багов декодеров.
#
# Идея: даже если внутри контейнера окажется уязвимая версия FFmpeg, границы ниже
# не дают эксплойту закрепиться, достучаться до сети или что-либо перезаписать
# за пределами явно выделенного выходного каталога.
#
# Это ПРИМЕР для адаптации под конкретный thumbnailer/сервис, не готовый к проду
# сервис "из коробки".

services:
  media-thumbnailer:
    # Тег пиновать до ТОЧНОГО патч-релиза: плавающий "8.1-alpine" завтра
    # переедет на другую сборку, и пример перестанет соответствовать статье.
    #
    # ВНИМАНИЕ, проверено на этом стенде: тег образа НЕ равен версии внутри.
    # У jrottenberg/ffmpeg:8.1.2-alpine320 бинарник представляется как "8.1",
    # и фикса CVE-2026-8461 в нём нет. Маркер фикса — строка из коммита
    # 374b726f, которая появляется только начиная с n8.1.2:
    #
    #   docker run --rm --entrypoint sh <образ> -c \
    #     'strings -a $(find / -name "libavcodec.so*" | head -1) | grep "aligned to chroma"'
    #
    #   пусто            -> фикса нет
    #   строка найдена   -> фикс на месте
    #   (контроль: grep -i magicyuv по той же библиотеке должен что-то находить,
    #    иначе метод не работает и вывод «фикса нет» ничего не значит)
    #
    # Образ намеренно оставлен как есть: он показывает главный тезис статьи —
    # изоляция нужна именно потому, что уязвимый декодер у вас уже может быть,
    # а патч запаздывает или маскируется под правильный тег. Границы ниже
    # ограничивают ущерб независимо от того, пропатчен ли FFmpeg внутри.
    image: jrottenberg/ffmpeg:8.1.2-alpine320
    container_name: pixelsmash-sandbox-thumbnailer

    # Файловая система контейнера доступна только на чтение — процесс не может
    # переписать собственные бинарники/библиотеки, даже получив RCE.
    read_only: true

    # Полная изоляция сети: эксплойту, получившему выполнение кода, некуда
    # эксфильтровать данные и неоткуда скачать вторую стадию.
    network_mode: none

    # Сбрасываем все Linux capabilities и не выдаём ни одной обратно —
    # никакого CAP_SYS_ADMIN, CAP_NET_RAW и т.д.
    cap_drop:
      - ALL

    # Запрещаем процессу получать привилегии выше, чем были при старте
    # (например, через setuid-бинарники внутри образа).
    security_opt:
      - no-new-privileges:true

    # Непривилегированный пользователь: по умолчанию контейнер стартует под root,
    # и одного cap_drop для «hardened» примера мало — RCE внутри всё равно получил
    # бы uid 0 со всеми последствиями при любой ошибке в изоляции.
    # 65534:65534 — nobody:nogroup. Каталог ./out на хосте должен быть доступен
    # этому uid на запись (например: chown 65534:65534 ./out).
    user: "65534:65534"

    # --- Лимиты ресурсов ---
    # Плоские опции (а не deploy.resources) — работают в обычном docker compose
    # без swarm. Задавать оба способа одновременно нельзя: compose ругается
    # «can't set distinct values on pids_limit and deploy.resources.limits.pids».
    #
    # Потолок числа процессов — защита от fork-бомбы: ни cap_drop, ни лимит
    # памяти её не останавливают.
    pids_limit: 64

    # Даже DoS-краш (heap corruption без RCE) не должен положить хост или
    # соседние контейнеры.
    cpus: 1.0
    mem_limit: 512m

    # read_only не даёт писать даже во временные каталоги — выделяем их
    # отдельно как tmpfs (память, исчезает при остановке контейнера).
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    volumes:
      # Входной файл — единственный, который контейнер видит, и только на чтение.
      # Указывайте конкретный файл, а не всю папку с медиатекой.
      - ./in/suspicious-input.mkv:/sandbox/in/input.mkv:ro

      # Выходной каталог — единственное место, куда контейнеру разрешено писать.
      - ./out:/sandbox/out:rw


    # Никакого демона/рестарта: одноразовый прогон над одним файлом.
    restart: "no"

    working_dir: /sandbox

    command:
      - "-i"
      - "/sandbox/in/input.mkv"
      - "-frames:v"
      - "1"
      - "/sandbox/out/thumb.png"
