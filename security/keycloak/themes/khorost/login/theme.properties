# Кастомная login-тема khorost.tech (Task 6).
#
# parent=keycloak — наследуем штатную login-тему Keycloak 26.7.0 (PatternFly-разметка,
# все FreeMarker-шаблоны *.ftl, базовые сообщения). Мы НЕ копируем ни одного шаблона —
# только докладываем свой CSS и одно переопределённое сообщение поверх.
#
# import=common/keycloak — общие ресурсы (шрифты pficon, vendor-скрипты), как у родителя.
#
# styles — свойство НЕ аддитивное: значение ребёнка ПОЛНОСТЬЮ заменяет родительское
# (у keycloak это `styles=css/login.css`). Поэтому перечисляем и базовый css/login.css
# (резолвится из родителя по цепочке наследования ресурсов), и свой css/khorost.css
# ПОСЛЕДНИМ — чтобы наши правила переопределяли базовые. stylesCommon (PatternFly v4/v3)
# мы не трогаем — оно наследуется от keycloak и подключается как обычно.
parent=keycloak
import=common/keycloak

styles=css/login.css css/khorost.css
