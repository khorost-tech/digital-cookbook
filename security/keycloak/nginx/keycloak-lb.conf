# nginx как L7-балансировщик перед двумя репликами Keycloak (production-стенд, статья 5).
# Монтируется как /etc/nginx/nginx.conf.
#
# Схема — TLS-offload (каноничный паттерн «Keycloak за reverse-proxy»):
#   клиент → HTTPS :8443 (nginx терминирует TLS self-signed сертификатом)
#          → HTTP keycloak-1:8080 / keycloak-2:8080 (внутри доверенной docker-сети)
# nginx проставляет X-Forwarded-Proto=https и X-Forwarded-*; Keycloak доверяет им через
# KC_PROXY_HEADERS=xforwarded и строит корректные iss/redirect по KC_HOSTNAME=https://localhost:8443,
# несмотря на то что до него запрос дошёл по http.
#
# Почему offload, а не re-encrypt на keycloak:8443: при проксировании HTTPS→HTTPS
# Quarkus-listener Keycloak рвал TLS-handshake от nginx (alert 47 illegal_parameter).
# Offload — стандартный production-подход (TLS терминируется на границе, дальше — HTTP
# в приватной сети). Собственный HTTPS реплик (KC_HTTPS_CERTIFICATE_FILE, порт 8443)
# при этом остаётся включён и проверяется прямым доступом к репликам (см. README/отчёт).
# 1 worker: у каждого worker'а nginx свой счётчик round-robin, поэтому при
# нескольких worker'ах и по одному запросу на соединение балансировка может
# «залипать» на первой реплике. Для наглядного и детерминированного RR в стенде —
# один worker. В реальном проде — auto (нагрузка на многих соединениях балансируется
# статистически ровно и без этого).
worker_processes 1;
events { worker_connections 1024; }

http {
    # Пул реплик. По умолчанию round-robin — намеренно, чтобы для демонстрации
    # распределённой сессии (Infinispan) запросы попадали на разные ноды. В реальном
    # проде при желании — sticky по cookie (`sticky` в nginx-plus) или ip_hash;
    # с distributed-cache сессия всё равно шарится, sticky нужен лишь для локальности.
    upstream keycloak_cluster {
        server keycloak-1:8080 max_fails=3 fail_timeout=10s;
        server keycloak-2:8080 max_fails=3 fail_timeout=10s;
        # ip_hash;   # раскомментировать для sticky-балансировки по клиентскому IP
    }

    # Диагностический лог: видно, на какую реплику ушёл каждый запрос (upstream_addr).
    log_format lb '$remote_addr -> $upstream_addr "$request" $status';
    access_log /dev/stdout lb;

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/keycloak.crt.pem;
        ssl_certificate_key /etc/nginx/certs/keycloak.key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://keycloak_cluster;

            # Заголовки, по которым Keycloak (KC_PROXY_HEADERS=xforwarded) восстанавливает
            # исходную схему/хост/клиента вместо адреса nginx.
            proxy_set_header Host              $host:8443;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host:8443;
            proxy_set_header X-Forwarded-Port  8443;

            # Отдаём наружу, какая реплика обслужила запрос — удобно для проверки
            # балансировки и распределённой сессии.
            add_header X-Upstream $upstream_addr always;
        }
    }
}
