# Collector в режиме span-метрик: те же три сигнала, что в базовом конфиге, плюс
# коннектор span_metrics — он считает RED прямо из спанов и отдаёт их в
# Prometheus вместе с exemplars.
#
# Отдельный файл, а не правка базового: базовый прогон стенда обязан остаться
# прежним, иначе поедут проверки волн 1 и 2, где числа уже зафиксированы.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  batch:
    timeout: 1s
    send_batch_size: 512

connectors:
  # Коннектор — это одновременно экспортёр для одного пайплайна и приёмник для
  # другого: спаны входят в него из пайплайна traces, метрики выходят в
  # пайплайн metrics/spanmetrics. Отсюда и двойное упоминание в service ниже.
  spanmetrics:
    # Размерности берутся из семантических конвенций OTel, а не придумываются:
    # дашборд и алерты, написанные на http.route, переносятся между сервисами и
    # языками, а на своём endpoint — нет.
    dimensions:
      - name: http.route
      - name: http.response.status_code
    # Границы гистограммы заданы явно. По умолчанию коннектор берёт свой набор,
    # и он не обязан совпадать с границами метрик статьи 4 — а сравнивать
    # перцентили из двух источников с разными бакетами бессмысленно.
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s]
    # Первое из трёх условий цепочки exemplars. Два других — enable_open_metrics
    # у экспортёра ниже и --enable-feature=exemplar-storage у Prometheus.
    # Любое невыполненное ломает цепочку молча: метрики при этом исправны.
    exemplars:
      enabled: true

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
    # Держать одинаковым во всех конфигах: от него зависит, через сколько
    # исчезает метрика мёртвого сервиса, и расхождение между режимами выглядит
    # как разное поведение алерта ServiceDown.
    metric_expiration: 2m
    # Второе условие цепочки exemplars: в обычном формате Prometheus exemplars
    # передать нечем, они существуют только в OpenMetrics.
    enable_open_metrics: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # Спаны уходят и в Tempo, и в коннектор: трейсы должны сохраниться, иначе
      # прыжок из exemplar приведёт в пустоту.
      exporters: [otlp/tempo, spanmetrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
