# Метрики приложений приходят не сюда напрямую, а в Collector по OTLP; здесь мы
# скрейпим то, что Collector экспонирует (порт 8889), и его собственную
# телеметрию (8888).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

# Правила записи и алертинга. Файлы подхватываются по маске, но сам Prometheus
# НЕ перечитывает их сам: после правки нужен reload (SIGHUP или POST /-/reload,
# последний работает только с --web.enable-lifecycle).
rule_files:
  - /etc/prometheus/rules/*.yml

# Куда отправлять сработавшие алерты. Prometheus только вычисляет правила;
# группировкой, подавлением и доставкой занимается Alertmanager.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otelcol-self
    static_configs:
      - targets: ["otelcol:8888"]

  - job_name: otelcol-apps
    static_configs:
      - targets: ["otelcol:8889"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Метрики самого Alertmanager. Нужны не для полноты: по ним видно
  # недоставленные уведомления (alertmanager_notifications_failed_total), а это
  # именно тот отказ, который иначе замечают в момент, когда алерт был нужен.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
