# SLO, бюджет ошибок и алерты по скорости его расходования.
#
# ============================ ВАЖНО ПРО ОКНА ============================
# Окна здесь СТЕНДОВЫЕ: минуты вместо суток. В проде окно SLO — 28 или 30 дней,
# а окна burn rate — 5m/1h и 30m/6h. Здесь они сжаты, чтобы алерт успел
# сработать за время прогона проверки, а не за сутки.
#
# Копировать эти числа в прод нельзя: на сжатых окнах алерт реагирует на
# случайный всплеск в несколько запросов. Что менять при переносе — сказано у
# каждого правила отдельно.
# ========================================================================
#
# SLI выбраны два, и оба — со стороны пользователя, а не сервера:
#   доступность — доля запросов, завершившихся НЕ ошибкой сервера;
#   латентность — доля запросов быстрее порога.
# Утилизация процессора, память и длина очередей в SLI не входят: пользователю
# всё равно, чем занят сервер, если ответ приходит вовремя и без ошибки.

groups:
  - name: slo-sli
    interval: 15s
    rules:
      # --- SLI доступности ---------------------------------------------------
      #
      # Четырёхсотые в бюджет НЕ входят. 404 на несуществующий артикул — это
      # правильная работа системы, и включение его в SLI означало бы, что бюджет
      # тратят пользователи, ошибающиеся в вводе.
      #
      # Знаменатель не занулён: при отсутствии трафика правильный ответ — «нет
      # данных», а не «доступность 100%». Подставленная единица показала бы
      # идеальное здоровье у остановленного сервиса.
      - record: slo:availability:ratio_rate5m
        expr: |
          1 - (
            job:http_server_requests_errors:rate5m
              /
            job:http_server_requests:rate5m
          )

      # --- SLI латентности --------------------------------------------------
      #
      # Порог 0.1 с взят не с потолка: он совпадает с границей бакета. Иначе
      # доля «быстрее порога» считалась бы интерполяцией внутри бакета, то есть
      # оценкой с точностью в ширину бакета (замер этого эффекта — в results/
      # 07-metrics-findings.txt, там два p95 разошлись только из-за сетки).
      #
      # ПРИ ПЕРЕНОСЕ: порог обязан быть границей бакета вашей гистограммы. Если
      # нужного значения в сетке нет — добавьте границу, а не считайте между.
      - record: slo:latency:ratio_rate5m
        expr: |
          sum by (service_name) (
            rate(http_server_request_duration_seconds_bucket{le="0.1"}[5m])
          )
            /
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count[5m])
          )

  - name: slo-burn-rate
    interval: 15s
    rules:
      # --- Burn rate ---------------------------------------------------------
      #
      # Burn rate — во сколько раз быстрее бюджет тратится по сравнению с
      # темпом, при котором его хватит ровно на весь период SLO.
      #
      # Цель 99% -> допустимая доля ошибок 1% -> burn rate = (доля ошибок) / 0.01.
      # Burn rate = 1 означает «истратим бюджет ровно к концу периода».
      # Burn rate = 14.4 означает «истратим весь месячный бюджет за 2 часа»
      # (14.4 = 30 дней / 50 часов; при таком темпе 100% бюджета уходит за
      # 30*24/14.4 = 50 часов, а 2% бюджета — за час).
      #
      # ПРИ ПЕРЕНОСЕ: 0.01 в знаменателе — это (1 - цель SLO). Для 99.9% там
      # будет 0.001, и пороги алертов остаются те же — они выражены в burn rate,
      # а не в долях ошибок, именно чтобы не пересчитывать их при смене цели.
      - record: slo:error_budget_burn:rate5m
        expr: |
          (
            job:http_server_requests_errors:rate5m
              /
            job:http_server_requests:rate5m
          ) / 0.01

      # Длинное окно. В проде это 1h; здесь 10m — стенд живёт минуты.
      #
      # ВНИМАНИЕ на внутренние скобки вокруг всего `or`. У оператора `or`
      # приоритет НИЖЕ, чем у деления, поэтому без них выражение читается как
      # «числитель ИЛИ (нуль / знаменатель)», то есть деления на знаменатель для
      # основной ветки не происходит вовсе — получается абсолютный rate ошибок,
      # делённый на 0.01, а не доля.
      #
      # promtool такую запись принимает: синтаксис верен, ошибка семантическая.
      # Замерено на стенде при нагрузке из одних 502: без скобок 16,8, со
      # скобками 100. Верно второе — доля ошибок 100% при цели 99% даёт burn
      # rate 1/0.01 = 100. И заметьте, чем это коварно: 16,8 тоже больше порога
      # 14.4, алерт бы «сработал», но значение зависело бы от абсолютного RPS —
      # при слабом трафике с полностью сломанным сервисом оно осталось бы ниже
      # порога, и алерт бы молчал.
      - record: slo:error_budget_burn:rate10m
        expr: |
          (
            (
              sum by (service_name) (
                rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[10m])
              )
              or on (service_name)
              (0 * sum by (service_name) (rate(http_server_request_duration_seconds_count[10m])))
            )
              /
            sum by (service_name) (rate(http_server_request_duration_seconds_count[10m]))
          ) / 0.01

  - name: slo-alerts
    interval: 15s
    rules:
      # --- Быстрый алерт -----------------------------------------------------
      #
      # Multi-window: условие требует превышения порога на КОРОТКОМ и на ДЛИННОМ
      # окне одновременно. Смысл конъюнкции — не в строгости, а в шуме: короткое
      # окно реагирует быстро, но дёргается на всплесках; длинное подтверждает,
      # что деградация не мгновенная. Одно короткое окно даёт ложные срабатывания,
      # одно длинное — опоздание.
      #
      # Порог 14.4 берётся из SRE-практики Google: при таком темпе 2% месячного
      # бюджета уходит за час, и разбудить человека ночью оправданно.
      #
      # for: 30s — стендовое значение. В проде для быстрого алерта обычно 2m:
      # это защита от единичного выброса, который окна ещё не сгладили.
      - alert: SLOBurnRateFast
        expr: |
          slo:error_budget_burn:rate5m > 14.4
            and
          slo:error_budget_burn:rate10m > 14.4
        for: 30s
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "бюджет ошибок тратится быстро: {{ $labels.service_name }}"
          description: "burn rate выше 14.4 на коротком и длинном окне — при таком темпе месячный бюджет уходит за 2 часа"

      # --- Медленный алерт ---------------------------------------------------
      #
      # Порог 6: 5% бюджета за 6 часов. Такое не требует ночного звонка, но
      # требует, чтобы кто-то посмотрел в рабочее время — отсюда severity
      # warning и более длинный for.
      - alert: SLOBurnRateSlow
        expr: |
          slo:error_budget_burn:rate5m > 6
            and
          slo:error_budget_burn:rate10m > 6
        for: 1m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "бюджет ошибок тратится заметно быстрее плана: {{ $labels.service_name }}"
          description: "burn rate выше 6 на обоих окнах — посмотреть в рабочее время"

      # --- Алерт на пропажу трафика -----------------------------------------
      #
      # Это НЕ дополнение для полноты, а закрытие дыры, найденной замером.
      # histogram_quantile от нулевого rate возвращает NaN, а NaN не проходит ни
      # одно сравнение: на остановленном сервисе не срабатывает ни
      # `p95 > порог`, ни обратная проверка `p95 < порог`. Ровно так же ведёт
      # себя и доля ошибок — при нулевом трафике она не «ноль», её просто нет.
      #
      # ПЕРВАЯ ВЕРСИЯ ЭТОГО АЛЕРТА БЫЛА НЕВЕРНОЙ, и ошибка поучительная:
      #
      #     sum(job:http_server_requests:rate5m) == 0 or absent(...)
      #
      # `sum` без `by` схлопывает всё в одну серию БЕЗ лейблов. Следствий два, и
      # оба ломают замысел. Во-первых, алерт срабатывает только когда замолчал
      # ВЕСЬ стенд: если из двух сервисов умер один, сумма остаётся
      # положительной, и молчание одного сервиса остаётся незамеченным — ровно
      # та дыра, которую алерт должен был закрыть. Во-вторых, у сработавшего
      # алерта нет лейбла service_name, поэтому inhibit_rules с
      # `equal: [service_name]` не совпадёт НИКОГДА, и подавление производных
      # алертов не работает, хотя выглядит настроенным.
      #
      # Правильно — алерт НА КАЖДЫЙ ожидаемый сервис. Для этого нужен инвентарь:
      # по метрикам понять, что сервис «должен быть», нельзя — если он не отдал
      # ни одного запроса, серии просто нет, и отличить «умер» от «никогда не
      # существовал» метрики не позволяют. Инвентарь задаётся явно ниже.

      # ===================== TRAFFIC CONTRACT ============================
      #
      # Вторая версия этих правил тоже была неверной, и ошибка тоньше первой.
      # Инвентарь безусловно включал ОБА сервиса, а условие требовало от каждого
      # положительного HTTP-rate. На стенде это неправда: java-backend получает
      # запросы только ПРОИЗВОДНО, когда кто-то оформляет заказ. Стенд стоит без
      # нагрузки — java-backend совершенно исправен, а алерт горит critical.
      #
      # Вывод общий: «нет трафика» и «сервис не работает» — РАЗНЫЕ утверждения, и
      # для каждого сервиса надо явно сказать, какой сигнал от него ожидается.
      # Ниже два контракта вместо одного.

      # --- Контракт 1: сервис ЖИВ ------------------------------------------
      #
      # Ожидается от КАЖДОГО сервиса независимо от нагрузки: процесс работает и
      # экспортирует метрики рантайма. Это стендовый аналог `up` по таргетам —
      # здесь его нет, потому что приложения не скрейпятся, а пушат по OTLP.
      #
      # Имена метрик взяты по факту: у Go это go_memory_used_bytes (именно она,
      # а не go_goroutines — та приходит без service_name), у JVM
      # jvm_memory_used_bytes. Умножение на нуль плюс единица превращает любое
      # значение в признак «жив», сохраняя лейбл service_name.
      #
      # ВАЖНО ПРО ЗАДЕРЖКУ ОБНАРУЖЕНИЯ. Признак жизни исчезает НЕ сразу после
      # смерти процесса, и слагаемых здесь несколько:
      #   - metric_expiration у prometheus exporter в Collector (задан явно в
      #     otelcol/config.yaml — 2m): пока он не истёк, экспортёр продолжает
      #     отдавать последнее известное значение, и мёртвый сервис выглядит живым;
      #   - периодичность проверки экспирации внутри экспортёра;
      #   - staleness в Prometheus и интервал вычисления самого правила (15 с);
      #   - `for` у алерта.
      #
      # Замерено ИТОГОМ, а не по слагаемым: при metric_expiration 2m признак жизни
      # java-backend исчез через 216 с после остановки контейнера. Раскладывать эти
      # 216 с по составляющим я не измерял — и потому не утверждаю, что задержка
      # равна экспирации. Практический вывод от этого не меняется: в push-модели
      # обнаружение смерти ограничено снизу конвейером доставки, а не вашим `for`.
      - record: slo:service:alive
        expr: |
          max by (service_name) (go_memory_used_bytes) * 0 + 1
            or
          max by (service_name) (jvm_memory_used_bytes) * 0 + 1

      # Инвентарь ожидаемых сервисов. `vector(1)` даёт серию без лейблов, а
      # label_replace навешивает на неё service_name — получается справочник
      # «какие сервисы обязаны существовать».
      #
      # ПРИ ПЕРЕНОСЕ: это то место, которое надо править при добавлении сервиса.
      # В проде инвентарь обычно приходит из service discovery (`up` по таргетам
      # или kube_deployment_spec_replicas), и тогда правило строится поверх него.
      - record: slo:service:expected
        expr: |
          label_replace(vector(1), "service_name", "go-frontend", "", "")
            or
          label_replace(vector(1), "service_name", "java-backend", "", "")

      # Сервис ожидается, но не подаёт признаков жизни. Вот ЭТО и есть «сервис
      # не работает» — состояние, при котором алерты по его латентности и доле
      # ошибок бессмысленны (у них NaN или пустота).
      - alert: ServiceDown
        expr: |
          slo:service:expected
            unless
          slo:service:alive
        for: 1m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "сервис {{ $labels.service_name }} не экспортирует метрики рантайма"
          description: "процесс не отвечает признаками жизни; алерты по его латентности и доле ошибок в этом состоянии молчат"

      # --- Контракт 2: ТОЧКА ВХОДА обслуживает запросы ---------------------
      #
      # Ожидание пользовательского трафика осмысленно ТОЛЬКО для точки входа:
      # go-frontend принимает заказы извне. Для java-backend такого ожидания нет
      # намеренно — его трафик производный, и требовать его при простое значит
      # получать ложный critical на исправном сервисе.
      #
      # ПРИ ПЕРЕНОСЕ: если у внутреннего сервиса есть СВОЙ контракт (обработка
      # очереди, cron, черный ящик probe), заводите отдельный алерт по его
      # собственному счётчику — например по числу обработанных сообщений, — а не
      # по входящему HTTP.
      - alert: NoTrafficAtEntrypoint
        expr: |
          label_replace(vector(1), "service_name", "go-frontend", "", "")
            unless
          (job:http_server_requests:rate5m{service_name="go-frontend"} > 0)
        for: 1m
        labels:
          severity: warning
          slo: availability
          scope: entrypoint
        annotations:
          summary: "точка входа не обслуживает запросы"
          description: "go-frontend не принял ни одного запроса за окно. severity warning, а не critical: на стенде и в проде ночью отсутствие заказов — нормальное состояние, повод посмотреть, а не будить"
