# Alertmanager стенда: одна цель — доставить уведомление приёмнику, который
# проверка сможет опросить точным критерием.
#
# Все таймеры СТЕНДОВЫЕ, сжатые. Что они значат и на что менять в проде —
# у каждого отдельно.

global:
  # Через сколько после последнего firing алерт считается погасшим, если
  # Prometheus перестал его присылать. В проде 5m; здесь коротко, чтобы проверка
  # «алерт погас» укладывалась в прогон.
  resolve_timeout: 1m

route:
  receiver: webhook
  # Группировка по имени алерта и сервису. Без group_by по service_name два
  # сломанных сервиса дали бы ОДНО уведомление, и проверка «пришло два» не
  # прошла бы — при том что алерты сработали правильно.
  group_by: [alertname, service_name]
  # Сколько ждать перед отправкой первого уведомления группы: время на то, чтобы
  # в группу успели попасть остальные алерты. В проде 30s.
  group_wait: 5s
  # Пауза перед отправкой уведомления о ДОБАВЛЕНИИ алерта в существующую группу.
  # В проде 5m.
  group_interval: 10s
  # Как часто напоминать о том, что всё ещё горит. В проде 4h — иначе повторы
  # превращаются в шум, от которого перестают реагировать. Здесь 30s, чтобы
  # проверка увидела и повтор.
  repeat_interval: 30s

  routes:
    # Критические уходят без задержки группировки: смысл быстрого алерта в
    # скорости, и ждать ради красивой группы нечего.
    - matchers:
        - severity = "critical"
      receiver: webhook
      group_wait: 0s

receivers:
  - name: webhook
    webhook_configs:
      - url: http://alert-webhook:9099/alerts
        # Уведомления о погасших алертах нужны: проверка «алерт не горит на
        # нормальной нагрузке» опирается на переход в resolved, а не на
        # отсутствие сообщений.
        send_resolved: true

# Подавление: если сервис не обслуживает запросы, алерты про его долю ошибок и
# латентность бессмысленны — при нулевом трафике у них либо NaN, либо пустота.
# Без inhibit дежурный получил бы несколько уведомлений об одной остановке.
#
# ИСТОЧНИК — ИМЕННО per-service алерт (ServiceDown), и это была ошибка в первой
# версии: там источником стоял глобальный алерт на отсутствие трафика, у которого
# лейбла service_name НЕТ вовсе (внутри `sum` без `by` лейблы схлопываются).
# Из-за этого `equal: [service_name]` не мог совпасть НИКОГДА, и подавление не
# работало, хотя конфиг выглядел настроенным. Такой дефект молчаливый: он
# проявляется только в инциденте, когда дежурный получает лишние уведомления.
inhibit_rules:
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - slo = "availability"
    # Подавляется только в пределах одного сервиса: остановка go-frontend не
    # причина молчать про java-backend. Работает потому, что у источника лейбл
    # service_name есть — он приходит из инвентаря slo:service:expected.
    equal: [service_name]

  # Мёртвый сервис подавляет и жалобу на отсутствие трафика у точки входа: если
  # go-frontend не работает, сообщать отдельно, что он не принимает запросы, —
  # это второе уведомление об одной причине.
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - alertname = "NoTrafficAtEntrypoint"
    equal: [service_name]
