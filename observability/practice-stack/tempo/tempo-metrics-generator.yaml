# Tempo 3.0 в монолитном режиме (-target=all по умолчанию): всё в одном
# процессе, хранение на локальном диске.
#
# ВАЖНО про версию. Tempo 3.0 — мажорный релиз с новой архитектурой записи:
# legacy ingesters удалены, вместо них live-store и block-builder, компакция
# управляется backend-scheduler. Конфиг из 2.x здесь НЕ заводится: секции
# `ingester` и `compactor` на верхнем уровне отвергаются с
#   field ingester not found in type app.Config
#   field compactor not found in type app.Config
# (проверено `-config.verify=true` на 3.0.2). Для переноса своих 2.x-конфигов
# в комплекте есть `tempo-cli migrate config`.
#
# Единственная причина, по которой стенду не нужны эти секции: в 3.0 дефолты
# live-store уже подходящие — max_block_duration 30s, complete_block_timeout
# 20m. В 2.x приходилось их занижать вручную, иначе свежий трейс не находился
# поиском ещё полчаса после прогона.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false

# --- генератор метрик ---------------------------------------------------------
#
# Второй путь получения span-метрик (ст. 7): их считает не Collector, а сам
# бэкенд трейсов. Смысл сравнения в том, что источник данных у путей ОДИН —
# спаны, — а обрабатываются они в разных местах и на разной стадии.
metrics_generator:
  registry:
    # Лейбл, по которому в Prometheus видно, кто именно посчитал метрику.
    # Без него две серии с одинаковым именем от Collector и от Tempo слились бы,
    # и сравнить пути стало бы нельзя.
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# Процессоры генератора включаются НЕ в самом блоке metrics_generator, а в
# overrides: по умолчанию они выключены для всех tenant, и конфиг генератора
# без этой секции просто ничего не делает — молча, без ошибки при старте.
overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
