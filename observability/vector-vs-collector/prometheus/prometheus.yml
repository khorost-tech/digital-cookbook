# Собирает метрики САМИХ конвейеров. Цели, чей профиль сейчас не поднят,
# будут down — это ожидаемо: в каждый момент работает ровно один конвейер.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: vector
    static_configs:
      - targets: ["vector:9602"]

  - job_name: otelcol
    static_configs:
      - targets: ["otelcol:8888"]

  - job_name: fluentbit
    static_configs:
      - targets: ["fluentbit:2020"]
    metrics_path: /api/v2/metrics/prometheus
