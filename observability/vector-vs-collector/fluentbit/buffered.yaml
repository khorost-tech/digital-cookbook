# Конвейер Fluent Bit с ДИСКОВЫМ хранением чанков — для замера 3.
# Отдельный файл по той же причине, что и у двух других: конфигурацию замеров
# 1 и 2 задним числом менять нельзя.
#
# У Fluent Bit устойчивость задаётся не на выходе, а на ВХОДЕ: storage.type
# filesystem у input плюс лимит на выходе. Это третья модель из трёх:
# у Vector буфер на синке, у Collector очередь экспортёра, здесь — хранилище
# чанков входа.
service:
  flush: 1
  log_level: info
  parsers_file: /etc/fluent-bit/parsers.yaml
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  storage.path: /var/lib/fluent-bit
  storage.sync: normal
  storage.checksum: off
  storage.backlog.mem_limit: 64M

pipeline:
  inputs:
    - name: tail
      path: /logs/nginx-access.log
      tag: nginx
      parser: nginx_combined
      read_from_head: true
      db: /var/lib/fluent-bit/nginx.db
      storage.type: filesystem

    - name: tail
      path: /logs/app.log
      tag: app
      parser: app_json
      read_from_head: true
      db: /var/lib/fluent-bit/app.db
      storage.type: filesystem

  filters:
    - name: modify
      match: nginx
      set:
        - service nginx
        - pipeline fluentbit
      remove:
        - user

    - name: modify
      match: app
      set:
        - pipeline fluentbit

    - name: grep
      match: nginx
      exclude: request /health

  outputs:
    - name: opensearch
      match: "*"
      host: opensearch
      port: 9200
      index: logs-fluentbit-buffered
      tls: on
      tls.verify: off
      http_user: admin
      http_passwd: VectorDemo#2026
      suppress_type_name: on
      buffer_size: 8M
      # Ёмкость дисковой очереди этого выхода и политика повторов.
      # retry_limit: no_limits — повторять, пока не доставим: аналог
      # when_full: block у Vector по намерению «лучше задержка, чем потеря».
      storage.total_limit_size: 256M
      retry_limit: no_limits
