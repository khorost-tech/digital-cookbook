# Vector: та же намеренная ошибка с меткой, но с ЯВНОЙ ПОЛИТИКОЙ БУФЕРОВ.
#
# Эта конфигурация НАМЕРЕННО НЕПРАВИЛЬНАЯ и нужна замеру кардинальности: она
# показывает разницу между «положил уникальное значение в тело записи» и
# «положил его в метку». В первом случае растёт объём, во втором — число
# потоков, и это разные беды с разной ценой.
#
# У OpenSearch аналога нет: понятия потока в его модели не существует, поле
# просто попадает в индекс. Поэтому для него оба прогона одинаковы, и разница
# видна только по объёму.
#
#
# Зачем эта конфигурация. Замер кардинальности показал: когда синк Loki
# отказывается принимать, соседние синки получают лишь пятую часть потока. Из
# этого напрашивался вывод «нужны раздельные буферы» — и он НЕВЕРЕН. Буфер у
# каждого синка Vector и так свой; беда не в том, что буфер общий, а в том, что
# он КОНЕЧЕН и по умолчанию заполняется с политикой when_full: block. Когда
# буфер отказавшего синка забит, block останавливает отдачу вверх по топологии
# — и тормозит всех, кто читает из того же источника.
#
# Здесь политика задана явно и проверяется замером scripts/bench-isolation.sh:
# у синка Loki when_full: drop_newest — переполнение выбрасывает записи вместо
# того, чтобы останавливать конвейер. Это РАЗМЕН, а не оптимизация: соседи
# получают весь поток ценой молчаливой потери у отказавшего.
#
# Исходная конфигурация — vector/agent.yaml. Ничего не
# ограничивается и не оптимизируется: так стенд показывает, что получает
# инженер, который просто подключил три бэкенда и пошёл дальше. Второй прогон
# идёт на agent-tuned.yaml.
#
# УСТРОЙСТВО, от которого зависит честность всего сравнения: трансформация
# `parse` стоит ДО ветвления на синки. Все три получают один и тот же объект.
# Если размечать в каждом синке отдельно, разница объёмов окажется разницей
# разметки, а не моделей индексации.

data_dir: /var/lib/vector

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  app_file:
    type: file
    include:
      - /logs/app.log
    read_from: beginning
    fingerprint:
      strategy: checksum


  # Внутренние метрики Vector. Нужны замеру изоляции: без счётчика выброшенных
  # записей «политика drop_newest сработала» и «переполнения не было вовсе»
  # выглядят одинаково. Экспортер только слушает порт, в бэкенды логов не пишет,
  # поэтому на замеры объёма не влияет.
  internal:
    type: internal_metrics

transforms:
  parse:
    type: remap
    inputs: [app_file]
    source: |
      # Генератор пишет готовый JSON, поэтому разбор простой. Ошибка разбора не
      # глотается: битая строка должна быть видна, а не молча исчезнуть из
      # одного бэкенда, перекосив сравнение.
      . = parse_json!(.message)

sinks:
  # --- Loki ------------------------------------------------------------------
  to_loki:
    type: loki
    inputs: [parse]
    endpoint: http://loki:3100
    encoding:
      codec: json
    # Метки — то, по чему Loki строит индекс. Здесь их две, обе низкой
    # кардинальности. Заметьте: Loki ДОБАВИТ к ним свою — service_name, которую
    # выводит из service. То есть меток в итоге больше, чем задано здесь, и это
    # надо помнить при счёте стримов.
    #
    # Метка detected_level в ЭТОМ конвейере НЕ появляется, хотя при прямом push
    # в Loki появляется (results/00-feasibility.txt снималась именно так). Набор
    # меток зависит от способа доставки; фактический снимает и сверяет точным
    # равенством scripts/verify-equivalence.sh — сейчас это level, service,
    # service_name.
    labels:
      service: "{{ service }}"
      level: "{{ level }}"
      # НАМЕРЕННАЯ ОШИБКА, ради которой существует эта конфигурация: поле с
      # уникальным значением объявлено МЕТКОЙ. Каждое значение порождает новый
      # поток, и индекс Loki растёт линейно по числу записей.
      request_id: "{{ request_id }}"
    # Буфер синка. max_events задан явно, чтобы предел был виден в конфиге, а не
    # подразумевался; when_full: drop_newest — то самое отличие от штатного
    # поведения. ПОТЕРИ ЗДЕСЬ ШТАТНЫ, но НЕ ВИДНЫ напрямую: метрики
    # vector_buffer_discarded_events_total в Vector 0.57 не существует, а в лог
    # выброшенные записи не попадают. Их приходится выводить из баланса буфера —
    # см. balance_stats в scripts/bench-isolation.sh.
    buffer:
      type: memory
      max_events: 500
      when_full: drop_newest
    # Vector 0.57 требует у шаблонов «базу confinement» — статический префикс,
    # по которому видно, куда синк потенциально может писать. Для ИНДЕКСОВ и
    # путей это защита по существу: без префикса `logs-{{ service }}` синк может
    # задеть произвольный индекс. Для МЕТОК Loki такого риска нет: метка не
    # адресует хранилище, она часть данных.
    #
    # Префикс здесь исказил бы сравнение (значения меток стали бы длиннее и
    # другими), поэтому включён явный отказ от confinement. Имя параметра
    # намеренно пугающее, и это правильно: решение должно быть осознанным.
    #
    # Тот же механизм в соседнем стенде серии ловится полной `vector validate`,
    # но пропускается `validate --no-environment` — см. vector-pipeline,
    # results/08-confinement.txt.
    dangerously_allow_unconfined_template_resolution: true
    out_of_order_action: accept

  # --- OpenSearch ------------------------------------------------------------
  to_opensearch:
    type: elasticsearch
    inputs: [parse]
    endpoints: ["http://opensearch:9200"]
    mode: bulk
    bulk:
      index: logs-default
    # У соседей политика штатная: они не должны терять записи, иначе замер
    # покажет разницу политик вместо изоляции отказа.
    buffer:
      type: memory
      max_events: 500
      when_full: block
    api_version: v8
    healthcheck:
      enabled: false

  # --- VictoriaLogs ----------------------------------------------------------
  #
  # Тот же синк elasticsearch: VictoriaLogs принимает bulk-протокол по своему
  # адресу. Параметры запроса обязательны и определяют модель хранения:
  #   _msg_field     — какое поле считать телом сообщения
  #   _time_field    — какое поле считать временем
  #   _stream_fields — какие поля образуют ПОТОК
  #
  # Последний параметр — прямой аналог меток Loki: указать в нём
  # высококардинальное поле значит устроить VictoriaLogs ту же беду, что метка с
  # уникальным значением устраивает Loki. В замере кардинальности это и
  # проверяется.
  to_victorialogs:
    type: elasticsearch
    inputs: [parse]
    endpoints: ["http://victorialogs:9428/insert/elasticsearch"]
    mode: bulk
    query:
      _msg_field: message
      _time_field: timestamp
      # То же самое для VictoriaLogs: поле уходит в _stream_fields, то есть
      # объявляется частью ПОТОКА. Прямой аналог метки Loki.
      _stream_fields: service,level,request_id
    # У соседей политика штатная: они не должны терять записи, иначе замер
    # покажет разницу политик вместо изоляции отказа.
    buffer:
      type: memory
      max_events: 500
      when_full: block
    api_version: v8
    healthcheck:
      enabled: false

  # --- внутренние метрики ----------------------------------------------------
  vector_metrics:
    type: prometheus_exporter
    inputs: [internal]
    address: 0.0.0.0:9598
