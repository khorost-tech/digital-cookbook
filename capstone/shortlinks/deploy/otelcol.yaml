# Трейсы сервиса (Go) и consumer'а (Java-агент) по OTLP/HTTP — в файл: стенд читает его и сверяет цепочки.
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch: {timeout: 500ms}
exporters:
  file:
    path: /out/spans.json
service:
  pipelines:
    traces: {receivers: [otlp], processors: [batch], exporters: [file]}
